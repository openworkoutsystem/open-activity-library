id: lib-1788127156883-69wd64
name: Sled Push
description: >-
  Drive a loaded sled down the turf at a forward lean with the arms locked or bent. It builds leg power and conditioning
  with no eccentric phase, so it leaves almost no soreness behind — hard work you can repeat often. Push through the
  whole foot and keep the spine long from head to hips.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
secondaryMuscles:
  - Calves
  - Hamstrings
  - Abs
  - Shoulders
equipment:
  - weight_plates
tags:
