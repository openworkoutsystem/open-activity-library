modality: hybrid
metValue: 8
instructions:
  - title: Set your grip
    detail: Grip the sled posts with the arms locked or bent and set a forward body lean.
  - title: Find the line
    detail: Brace the trunk so head, spine, and hips form one straight line.
  - title: Drive the legs
    detail: Push through the whole foot with long, powerful strides.
  - title: Pace the effort
    detail: Keep the steps rhythmic to the end of the run, then rest fully between pushes.
safetyNotes: >-
  Keep the spine long and neutral — letting the hips shoot up and the back round against a heavy sled strains the lower
  back. Hard sled sprints spike heart rate fast, so build up to all-out efforts over several sessions.
