instructions:
  - title: Starting Position
    detail: Stand with feet shoulder-width apart, arms at your sides.
  - title: Squat Down
    detail: Push your hips back and bend your knees to lower into a squat. Place your hands on the floor in front of you.
  - title: Jump Back to Plank
    detail: Jump or step your feet back into a high plank position. Keep your body in a straight line.
  - title: Optional Push-Up
    detail: Lower your chest to the floor for a push-up (modify on knees if needed).
  - title: Jump Forward
    detail: Jump or step your feet back toward your hands into a low squat position.
  - title: Explosive Jump
    detail: Stand up quickly and jump vertically, reaching your arms overhead.
safetyNotes: >-
  Land softly with bent knees. Modify by stepping instead of jumping. Avoid if you have wrist, shoulder, or lower back
  issues. Start slowly and focus on form over speed.
