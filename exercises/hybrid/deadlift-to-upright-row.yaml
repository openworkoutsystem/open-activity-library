id: lib-1775591936138-we2udo
name: Deadlift to Upright Row
description: "HIIT combo: Dumbbell Romanian deadlift transitioning to upright row for full body pull."
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
