modality: hybrid
metValue: 8.5
instructions:
  - title: Setup
    detail: Stand feet shoulder-width, dumbbells in front.
  - title: Deadlift Phase
    detail: Hinge hips back, lower dumbbells to shins, keep back flat.
  - title: Upright Row Phase
    detail: Explode up, pull elbows high to form triangle with chest, shoulders down.
  - title: Repeat
    detail: 20 reps continuous, fast tempo.
  - title: Rest
    detail: 15s between rounds.
safetyNotes: Keep shoulders retracted, no shrugging to prevent impingement—critical for left shoulder pain. Light weights.
