id: lib-1788127165823-mknhko
name: Medicine Ball Slam
description: >-
  Raise the ball fully overhead and drive it into the floor with everything you have. Full-body power that loads the
  lats and core through fast trunk flexion — and unlike most power work, you can repeat it all day. Hinge cleanly to
  pick the ball up between reps.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Back
  - Abs
secondaryMuscles:
  - Shoulders
  - Triceps
  - Glutes
equipment:
