  - Compound
  - Functional
modality: hybrid
metValue: 8
instructions:
  - title: Raise the ball
    detail: Reach the ball fully overhead, rising onto the toes.
  - title: Slam down hard
    detail: Drive the ball into the floor just in front of your feet with the whole body.
  - title: Hinge to retrieve
    detail: Squat or hinge with a flat back to pick the ball up.
  - title: Repeat with intent
    detail: Reset and throw every rep at full effort.
safetyNotes: >-
  Use a dead-bounce slam ball — a rubber medicine ball can rebound straight into your face. The pickup is where backs
  get tweaked; reset a flat spine on every single hinge.
