id: lib-1788127164453-7cae8r
name: Dumbbell Thruster
description: >-
  The thruster with a dumbbell in each hand — the same squat-to-press engine, friendlier setup. The bells sit on the
  shoulders and travel a natural path, which makes it the version most people should start with. Full squat depth and
  full lockout, every rep.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Shoulders
secondaryMuscles:
  - Glutes
  - Triceps
  - Abs
equipment:
  - dumbbells
tags:
  - Dumbbell
