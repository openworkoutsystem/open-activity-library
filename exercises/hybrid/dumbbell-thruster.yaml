  - Push
modality: hybrid
metValue: 8
unilateral: optional
instructions:
  - title: Bells to shoulders
    detail: Clean the dumbbells to the shoulders with palms facing in.
  - title: Squat to depth
    detail: Sit into a full front squat with the elbows slightly forward.
  - title: Drive to lockout
    detail: Stand fast and press the bells overhead in one continuous motion.
  - title: Cycle smoothly
    detail: Lower the bells to the shoulders while descending into the next rep.
safetyNotes: >-
  Keep the wrists neutral and finish every press to full lockout — a bell stalling overhead at fatigue has nowhere safe
  to go. Scale the load before scaling the depth.
