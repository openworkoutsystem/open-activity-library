instructions:
  - title: Start position
    detail: Feet together and arms down at your sides
  - title: Mid position
    detail: Jump and swing your arms out and up and feet out landing with your body making an X
  - title: Jump back and repeat
    detail: Jump back to start position and repeat the cycle
safetyNotes: >-
  Start with smaller sets if you're new to plyometrics. Stop if you feel knee, ankle, or shoulder pain. Modify by
  stepping side to side instead of jumping if you have joint issues or are carrying extra weight. Keep core engaged and
  land softly. This is a bodyweight exercise - no weight load applies.
