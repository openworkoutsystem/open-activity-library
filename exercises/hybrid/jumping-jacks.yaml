id: lib-1772516304525-4dqepu
name: Jumping Jacks
description: >-
  Jumping jacks are a classic bodyweight cardio exercise that improves coordination, endurance, and warms up the entire
  body by jumping while spreading arms and legs.
experienceLevelRecommended: beginner
