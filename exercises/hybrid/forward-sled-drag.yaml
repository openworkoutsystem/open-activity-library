id: lib-1788389639483-53whru
name: Forward Sled Drag
description: >-
  Clip the strap to a belt or hold the handles behind you and walk forward, leaning into the load with the sled trailing
  behind. Dragging forward works the posterior chain through long, powerful strides with no eccentric phase, so it
  builds sprint drive and conditioning without the soreness. Keep the spine long and drive the floor back with every
  step.
experienceLevelRecommended: beginner
schemaVersion: 1
