metValue: 8
instructions:
  - title: Set the load
    detail: Load the sled so you can keep walking without stalling. Heavier is fine once the steps stay continuous.
  - title: Take the strap behind you
    detail: Face away from the sled with the strap on a belt or the handles held behind your hips, arms long.
  - title: Lean and drive
    detail: >-
      Lean forward from the ankles with a long spine and drive the floor back with full strides, pushing through the
      whole foot.
  - title: Pace the trip
    detail: Keep the strides rhythmic to the end of the lane, then rest fully before the next drag.
safetyNotes: >-
  Lean from the ankles with a long spine rather than folding at the waist; a rounded back against a heavy sled is where
  forward drags go wrong. Use a harness or belt if hand-held handles pull the shoulders back. Start light enough that
  the steps never stall.
