id: lib-1788215817797-nvbfl0
name: Battle Rope Slam
description: >-
  Hinge back with a rope end in each hand, rip both arms overhead, then slam the ropes into the floor as the hips snap
  through. Unlike alternating waves, which are a steady grind, the slam is a single full-body power expression where
  lats, shoulders, and hips fire together on every rep. Reset to a tall stance between reps instead of chasing the rope
  with your arms only.
