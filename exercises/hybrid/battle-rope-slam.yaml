instructions:
  - title: Anchor and grip
    detail: >-
      Take a rope end in each hand with the rope anchored in front of you and back up until only a small amount of slack
      remains.
  - title: Set the stance
    detail: Stand with the feet just outside shoulder width, knees bent and hips back, chest up in an athletic quarter squat.
  - title: Load overhead
    detail: Extend the hips and pull both rope ends up above your head in one motion, finishing tall with the arms high.
  - title: Slam it down
    detail: >-
      Drive the ropes into the floor as hard as you can while the hips hinge back and the abs brace, ending with the
      hands near your knees.
  - title: Reset every rep
    detail: >-
      Return to the tall position before the next slam so each rep carries the same effort instead of fading into short
      chops.
safetyNotes: >-
  The overhead-to-slam arc loads the lower back if the spine rounds, so hinge from the hips and keep the back flat
  through the finish. Check the anchor before you start and keep other people well outside the arc of the ropes.
