id: lib-1773267005095-zc2qe7
name: Mountain Climbers
description: >-
  A high-intensity bodyweight cardio and core exercise performed in a plank position by alternately driving your knees
  toward your chest in a running motion. Classic Jillian Michaels Ripped in 30 move that builds core strength, cardio
  endurance, and coordination.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Abs
secondaryMuscles:
