instructions:
  - title: Starting Position
    detail: Begin in a high plank position with hands directly under shoulders, body in a straight line from head to heels.
  - title: Movement
    detail: >-
      Quickly drive one knee toward your chest, then immediately switch legs in a running motion while keeping your hips
      low and core tight.
  - title: Pace
    detail: Move as fast as possible while maintaining good form. Keep your shoulders stable and avoid letting your hips rise.
  - title: Breathing
    detail: Breathe steadily throughout the movement.
safetyNotes: >-
  Keep your core engaged to protect your lower back. Start slowly if you're new to the movement. Modify by performing
  from your knees if needed. Stop if you feel wrist or shoulder pain.
