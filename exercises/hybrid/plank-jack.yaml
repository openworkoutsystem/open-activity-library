id: lib-1788215817500-pnz1t5
name: Plank Jack
description: >-
  Hold a high plank and jump both feet out wide and back together while the hips stay level. It bolts a conditioning
  interval onto a plank, so the core resists movement while the heart rate climbs, which makes it a strong circuit
  filler or finisher. Keep the hips locked at shoulder height - if they pike or sag with each jump, slow the feet down.
experienceLevelRecommended: beginner
schemaVersion: 1
