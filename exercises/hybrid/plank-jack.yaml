instructions:
  - title: Start in plank
    detail: >-
      Set the hands under your shoulders in a high plank with the feet together and the body in one line from heels to
      head.
  - title: Brace the middle
    detail: Squeeze the glutes and pull the ribs down so the lower back stays flat before a single foot moves.
  - title: Jump the feet out
    detail: Hop both feet out past shoulder width and land softly on the balls of the feet without letting the hips rise.
  - title: Snap them back
    detail: Bring the feet back together at the same pace and hold a steady rhythm for the whole set.
safetyNotes: >-
  The wrists absorb repeated impact in extension, so switch to fists or push-up handles if they ache. End the set the
  moment the hips start piking or sagging, because a plank held badly under fatigue is where the lower back gets loaded.
