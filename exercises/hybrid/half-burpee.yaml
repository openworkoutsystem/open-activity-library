id: lib-1788127173536-rusbqp
name: Half Burpee
description: >-
  The burpee with the push-up and jump removed — squat, kick to plank, return, stand. It keeps the full-body pattern and
  heart-rate demand while stripping out the parts that break down first under fatigue. The right choice for circuits and
  for anyone still building the plank strength the full move demands.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Full Body
secondaryMuscles: []
equipment: []
tags:
  - Bodyweight
  - No Equipment
  - HIIT
  - Circuit Training
modality: hybrid
metValue: 6
instructions:
  - title: Squat and plant
    detail: Squat down and place both hands flat on the floor.
  - title: Step or hop back
    detail: Move the feet back to a straight-line plank.
  - title: Bring feet forward
    detail: Step or hop the feet back up outside the hands.
  - title: Stand tall
    detail: Stand fully upright before starting the next rep.
safetyNotes: >-
  Same rule as the full burpee — the plank position has to stay rigid on the way back. Step the feet instead of hopping
  if the hips sag or the wrists complain.
