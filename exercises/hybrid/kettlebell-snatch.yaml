  - Grip
modality: hybrid
metValue: 9.8
unilateral: always
instructions:
  - title: Hike the bell
    detail: Swing the bell back between the legs with a flat back and packed shoulder.
  - title: Snap the hips
    detail: Extend the hips hard so the bell floats upward close to the body.
  - title: Punch through
    detail: As the bell rises past the head, punch the hand through so it lands softly on the forearm.
  - title: Lock out overhead
    detail: Finish with the elbow locked and the biceps by the ear.
  - title: Lower and repeat
    detail: Drop the bell back into the swing arc in one controlled motion.
safetyNotes: >-
  A crashing catch bruises the forearm and a sweaty grip can launch the bell — chalk up and keep the space around you
  clear. Build volume gradually; the snatch tears hands before it tires lungs.
