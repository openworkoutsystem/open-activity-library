id: lib-1788127162558-uyrjg6
name: Kettlebell Snatch
description: >-
  One unbroken motion from the hike to a locked-out bell overhead. It's the kettlebell test of hip power, grip, and
  conditioning — nothing else exposes a weak link faster. Punch the hand through at the top so the bell settles softly
  instead of crashing onto the forearm.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
  - Shoulders
secondaryMuscles:
  - Traps
  - Forearms
  - Abs
equipment:
  - kettlebells
tags:
  - Kettlebell
