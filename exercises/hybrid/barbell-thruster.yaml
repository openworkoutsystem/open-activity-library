id: lib-1788127164330-lnayrx
name: Barbell Thruster
description: >-
  A front squat that flows straight into an overhead press — one rep, no pause. It's the conditioning world's heaviest
  hitter because the legs, shoulders, and lungs all pay at once. Drive the bar off the shoulders with the legs; the
  press only finishes what the squat started.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Shoulders
secondaryMuscles:
  - Glutes
  - Triceps
  - Abs
equipment:
