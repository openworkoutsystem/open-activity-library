modality: hybrid
metValue: 9
instructions:
  - title: Rack the bar
    detail: Hold the bar in a full front rack with elbows up and feet shoulder width.
  - title: Front squat
    detail: Squat to full depth with the torso tall.
  - title: Drive and press
    detail: Stand explosively and let the leg drive carry the bar straight into lockout.
  - title: Return in rhythm
    detail: Lower the bar to the rack as you descend into the next squat.
safetyNotes: >-
  The heart rate spikes faster than the legs fail — pace the early sets or form dies before the lungs do. Keep the heels
  down and elbows up; a collapsing front rack dumps the bar forward mid-rep.
