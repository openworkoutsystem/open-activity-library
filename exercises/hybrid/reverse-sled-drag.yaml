metValue: 8
instructions:
  - title: Set the load
    detail: Load the sled light enough that your steps never stall - continuous movement is the point, not a grind.
  - title: Face away
    detail: Turn your back to the sled, take the strap or handles in front of your hips with the arms long, and stand tall.
  - title: Walk backward
    detail: >-
      Step back toe first, then press the heel down and straighten the knee to pull the sled. Keep the steps short and
      quick with the chest up.
  - title: Finish the trip
    detail: Keep pulling to the end of the lane without letting the sled stall, then rest and repeat.
safetyNotes: >-
  You cannot see where you are going, so clear the lane before every trip and keep the turf free of plates and bands.
  Start lighter than pride suggests: the quads respond to steady continuous steps, and a stalled sled teaches nothing.
  Stop the set if the knees start tracking inward.
