id: lib-1788127166196-ulubco
name: Reverse Sled Drag
description: >-
  Face away from the sled, hold the strap or handles at your hips, and walk backward with short driving steps. Walking
  in reverse loads the quads through a long, knee-friendly range with no eccentric phase, which is why it doubles as
  knee rehab and as a brutal finisher. Keep the chest tall and push the floor away toe to heel.
experienceLevelRecommended: beginner
schemaVersion: 1
