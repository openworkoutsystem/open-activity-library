id: lib-1788215814984-924xv1
name: Dumbbell Pullover
description: >-
  Lie on a flat bench holding one dumbbell over your chest with both hands and lower it in an arc behind your head, then
  pull it back over your chest. It loads the chest and lats together through a deep overhead stretch that pressing and
  rowing never reach, which is why it survives as a classic upper body finisher. Keep the elbows slightly bent and
  locked at that angle the whole way.
experienceLevelRecommended: intermediate
schemaVersion: 1
