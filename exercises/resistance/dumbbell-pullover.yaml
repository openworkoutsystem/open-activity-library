metValue: 4
instructions:
  - title: Set the dumbbell
    detail: >-
      Sit on the end of a flat bench with one dumbbell on your thigh, then lie back along the bench and press it up over
      your chest.
  - title: Cup the head
    detail: >-
      Cup both palms flat against the inside of the top plate with thumbs wrapped, arms nearly straight and elbows bent
      just enough to stay soft.
  - title: Arc it back
    detail: >-
      Lower the dumbbell in a wide arc behind your head over three seconds, keeping the ribs down, until you feel a
      strong stretch across the chest and lats.
  - title: Pull it over
    detail: >-
      Pull the dumbbell back along the same arc until it is above your chest, driving with the lats and chest rather
      than bending the elbows.
safetyNotes: >-
  This is a deep loaded overhead stretch, so anyone with shoulder impingement or limited overhead range should shorten
  the arc or skip it. Go conservative on weight and make sure your grip on the plate is secure before the first rep,
  since the dumbbell travels directly over your face and neck.
