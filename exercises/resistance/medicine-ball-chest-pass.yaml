id: lib-1788127165958-e83rv7
name: Medicine Ball Chest Pass
description: >-
  Fire the ball off the chest into a solid wall with both hands, catch the rebound, and repeat. Trains upper-body power
  without the braking a bench press forces at lockout — you release the load instead of decelerating it. Intent is
  everything: every throw at full speed.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Chest
  - Triceps
secondaryMuscles:
  - Shoulders
  - Serratus Anterior
equipment:
  - medicine_ball
tags:
  - Plyometrics
  - Upper Body
  - Push
  - Functional
modality: resistance
metValue: 6
instructions:
  - title: Face the wall
    detail: Stand a few feet from a solid wall with the ball at your chest.
  - title: Fire the ball
    detail: Punch the ball off the chest as fast as possible.
  - title: Catch the rebound
    detail: Absorb the ball back to the chest with soft elbows.
  - title: Repeat immediately
    detail: Keep every pass at maximal speed.
safetyNotes: >-
  Stand close enough for a clean catch — long rebounds turn into jammed fingers. Keep the ball light; the goal is speed,
  and a heavy ball just turns this into a slow push.
