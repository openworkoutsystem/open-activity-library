modality: resistance
metValue: 5
unilateral: always
instructions:
  - title: Set a low box
    detail: >-
      Use a box or step at or just below knee height, lower than you would for a regular step-up. Place one whole foot
      on it with the shin vertical and stand close enough that the knee does not drift forward over the toes.
  - title: Hinge forward
    detail: >-
      Lean the torso forward from the hips to roughly forty-five degrees with a flat back, so the hips sit behind the
      front heel. This forward lean is what shifts the work from the quads to the glutes.
  - title: Drive through the heel
    detail: >-
      Push the front heel into the box and squeeze the glute to stand up on the box. Keep the trailing leg passive: no
      push-off from the floor, and let its heel lift or its toes pull up so it cannot help.
  - title: Lower with control
    detail: >-
      Sit the hips back and lower the trailing foot to the floor slowly, keeping the front shin vertical and the torso
      lean throughout. Touch the floor lightly and go again; finish all reps on one leg before switching.
safetyNotes: >-
  Keep the front knee tracking over the middle of the foot; if it caves inward, lower the box or drop the weight. The
  forward lean comes from the hips with a neutral spine, not from rounding the back. Choose a box you can control on the
  way down, and if the trailing leg keeps helping, slow the descent rather than adding load.
