id: lib-1788380793729-9lkq8o
name: Glute-Dominant Step-Up
description: >-
  A step-up rebuilt to load the glutes instead of the quads: a lower box, a forward torso lean from the hips, a vertical
  shin, and a drive through the heel with the trailing leg kept completely passive. Hold dumbbells at your sides once
  bodyweight sets stop being hard. Popularized by Bret Contreras as a hip-dominant alternative to the tall-box step-up,
  it trains the glutes through a long range in a single-leg stance without the knee taking the work.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
