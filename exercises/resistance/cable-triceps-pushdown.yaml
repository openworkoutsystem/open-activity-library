id: lib-1774910645748-c7uopf
name: Cable Triceps Pushdown
description: Cable tricep pushdowns for tricep isolation. Great for building arm size and lockout strength.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Triceps
secondaryMuscles: []
equipment:
  - cable_machine
tags:
  - Strength
modality: resistance
metValue: 5
instructions:
  - title: Setup
    detail: Attach straight bar or rope to high cable. Stand facing machine, elbows at sides.
  - title: Push down
    detail: Press the bar down by extending elbows until arms are straight. Keep elbows pinned to sides.
  - title: Squeeze
    detail: Hold the bottom position briefly, squeezing triceps.
  - title: Return
    detail: Slowly let the bar come back up to about 90 degrees at the elbow. Don't let elbows flare.
safetyNotes: Keep elbows stationary at sides. Don't use momentum or lean into the weight.
