instructions:
  - title: Setup
    detail: >-
      Stand with feet shoulder-width apart, toes slightly turned out. Arms can be extended in front of you or hands
      clasped at chest height for balance. Brace your core and keep your chest up.
  - title: Descent
    detail: >-
      Push your hips back and bend your knees to lower down. Keep your torso upright and knees tracking over your toes.
      Go down until your thighs are at least parallel to the floor.
  - title: Ascent
    detail: >-
      Drive through your heels and mid-foot to stand back up. Squeeze your glutes at the top. Maintain a neutral spine
      throughout the entire movement.
  - title: Breathing
    detail: Inhale on the way down, exhale forcefully as you push back up.
safetyNotes: >-
  Keep your knees tracking over your toes � avoid caving inward. Maintain a neutral spine throughout. If you have knee
  or hip issues, limit depth to a comfortable range. Start with a partial range of motion and work deeper as mobility
  allows. This is a bodyweight exercise - no weight load applies.
