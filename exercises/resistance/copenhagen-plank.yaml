id: lib-1788215816360-ia92wa
name: Copenhagen Plank
description: >-
  Lie on your side with the top leg resting on a bench and lift the hips so the inner thigh of that top leg holds your
  body off the floor. It is the most effective loaded adductor exercise you can do without a machine, and it has become
  standard groin-injury-prevention work for field and court athletes. Start with the bottom knee down and a short lever
  before chasing the full straight-leg version.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
