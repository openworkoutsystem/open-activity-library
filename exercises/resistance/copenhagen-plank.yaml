modality: resistance
metValue: 3.3
unilateral: always
instructions:
  - title: Set the bench
    detail: >-
      Lie on your side next to a flat bench and rest the inside of your top knee or lower shin on the bench surface,
      with the bench roughly at knee height.
  - title: Post the elbow
    detail: >-
      Prop yourself on the bottom forearm with the elbow directly under the shoulder, and stack your shoulders and hips
      in one vertical line.
  - title: Lift the hips
    detail: >-
      Press the top leg down into the bench to raise your hips until your body forms a straight line from head to feet,
      keeping the bottom leg off the floor if you can.
  - title: Hold and breathe
    detail: >-
      Hold the position with steady breathing and the top hip stacked, not rolled forward or back, then lower under
      control and switch sides.
safetyNotes: >-
  This puts a large isometric load through the adductor tendons, so a full straight-leg version on a cold or previously
  strained groin is a real strain risk - begin with the knee on the bench, hold 10 to 15 seconds, and add time before
  adding lever length. Stop immediately at any sharp pinch high in the inner thigh.
