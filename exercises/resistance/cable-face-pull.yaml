id: lib-1774910662513-tzq965
name: Cable Face Pull
description: Cable face pulls for rear delts, rotator cuff health, and upper back. Essential for shoulder balance and posture.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Shoulders
  - Traps
secondaryMuscles:
  - Back
equipment:
  - cable_machine
tags:
  - Balance
modality: resistance
metValue: 4
instructions:
  - title: Setup
    detail: Set cable at face height with rope attachment. Grip rope with thumbs toward you.
  - title: Pull
    detail: Pull rope toward face, splitting the rope apart. Drive elbows high and back.
  - title: Squeeze
    detail: Externally rotate shoulders at the end — hands should end up beside your ears. Squeeze rear delts.
  - title: Return
    detail: Slowly extend arms back to start. Don't let the weight slam.
safetyNotes: Use light weight — this is a precision movement. Don't lean back or use momentum.
