id: lib-1788131481205-nm577m
name: Wall Walk
description: >-
  From a push-up position with feet at the wall, walk the feet up and the hands back until you stand in a handstand line
  against it, then walk back down. It builds shoulder strength and endurance while teaching the stacked, hollow body
  position handstand work depends on. Keep the ribs tucked so you climb into a line, not a banana.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Shoulders
secondaryMuscles:
  - Triceps
  - Abs
  - Chest
equipment: []
tags:
  - Calisthenics
