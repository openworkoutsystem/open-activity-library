modality: resistance
metValue: 7
instructions:
  - title: Start prone
    detail: Lie facing away from the wall and press up to a push-up position with your soles against it.
  - title: Walk feet up
    detail: Step your feet up the wall while walking your hands back toward it.
  - title: Find the line
    detail: Stop when your chest nearly faces the wall and your body forms one vertical line.
  - title: Walk back down
    detail: Reverse hand-by-hand and foot-by-foot with control until you return to the floor.
safetyNotes: >-
  Fatigue shows up fast in the shoulders halfway up the wall — stop the set while you can still walk down under control,
  because collapsing mid-wall means landing on your head. Shorten the climb height before shortening the control.
