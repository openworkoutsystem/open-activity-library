modality: resistance
metValue: 3.5
instructions:
  - title: Set the pad
    detail: Sit with the balls of your feet on the platform and the pad snug across your lower thighs.
  - title: Find the stretch
    detail: Release the safety and lower your heels as far as they will comfortably go.
  - title: Press and squeeze
    detail: Drive up onto the toes and pause a full second at the top.
  - title: Control the descent
    detail: Lower slowly back into the stretch without bouncing.
safetyNotes: >-
  Ease into the bottom stretch instead of bouncing out of it — the Achilles takes the load there. Keep the pad on the
  thighs, not on the kneecaps.
