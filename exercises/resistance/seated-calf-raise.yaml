id: lib-1788127159950-x2n4pf
name: Seated Calf Raise
description: >-
  A calf raise done with the knees bent at ninety degrees, which slackens the gastrocnemius and shifts the work to the
  soleus underneath. Load sits on a pad across the thighs; press through the balls of the feet from a full stretch and
  squeeze at the top. The soleus responds to higher reps and pauses — don't rush the bottom.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Calves
secondaryMuscles: []
equipment:
  - weight_machines
