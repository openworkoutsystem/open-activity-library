id: lib-1788127159087-ht6rqw
name: Triceps Kickback
description: >-
  Extend the arm straight back from a hinge — peak-contraction triceps work. With the upper arm held parallel to the
  floor, the hardest point of the rep is full lockout, exactly where pushdowns and extensions go easy. It rewards light
  weight and strict form over ego loading.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Triceps
secondaryMuscles:
  - Rear Delts
equipment:
  - dumbbells
tags:
  - Isolation
  - Dumbbell
  - Upper Body
  - Strength
modality: resistance
metValue: 3.5
unilateral: optional
instructions:
  - title: Hinge and brace
    detail: Hinge at the hips with a flat back, supporting one hand on a bench or thigh.
  - title: Lift the elbow
    detail: Raise the working upper arm until it is parallel to the floor and hold it there.
  - title: Kick back
    detail: Straighten the arm fully behind you and squeeze at lockout.
  - title: Return under control
    detail: Bend the elbow back to 90 degrees without dropping the upper arm.
safetyNotes: >-
  Too much weight turns this into arm swinging with zero triceps tension — if the upper arm drops or the dumbbell moves
  with momentum, go lighter.
