  - No Equipment
modality: resistance
metValue: 3.3
instructions:
  - title: Pin the back
    detail: Lie on your back and press the lumbar spine firmly into the floor.
  - title: Lift into the dish
    detail: Raise the shoulders and legs a few inches so only the low back and hips touch down.
  - title: Extend the levers
    detail: Reach the arms overhead and straighten the legs only as far as the back stays pinned.
  - title: Hold and breathe
    detail: Maintain the shape with steady shallow breaths for the full hold.
safetyNotes: >-
  If the low back lifts off the floor, bend the knees or bring the arms to the sides — a shorter lever done right beats
  a long one done wrong. Neck strain means you are pulling with the head instead of curling from the ribs.
