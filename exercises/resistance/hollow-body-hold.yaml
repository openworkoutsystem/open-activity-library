id: lib-1788127157562-00t8ue
name: Hollow Body Hold
description: >-
  Lying on your back with the low back pressed down, arms and legs hover off the floor in a shallow dish shape. It is
  the gymnastic brace position — the same trunk shape that makes handstands, pull-ups, and heavy lifts solid. Lower the
  arms and legs only as far as the low back can stay pinned.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Abs
  - Transverse Abdominis
secondaryMuscles:
  - Hip Flexors
  - Quadriceps
equipment: []
tags:
  - Core
