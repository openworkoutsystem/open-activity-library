id: lib-1788127161105-q7qck2
name: Monster Walk
description: >-
  With a band around the legs, sit into a quarter squat and take deliberate lateral steps, keeping tension on the band
  the whole way. It wakes up the glute medius and teaches the knees to track over the toes — the standard opener before
  every leg day. Stay low and level; bobbing up between steps lets the glutes off the hook.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Abductors
  - Glutes
secondaryMuscles:
  - Quadriceps
equipment:
  - resistance_bands
tags:
