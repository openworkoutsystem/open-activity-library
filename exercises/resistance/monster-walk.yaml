modality: resistance
metValue: 3.5
instructions:
  - title: Band the legs
    detail: Loop a band above the knees or around the ankles and set feet hip-width apart.
  - title: Sit into it
    detail: Drop into a quarter squat with the chest up and knees pressed out.
  - title: Step sideways
    detail: Take a controlled lateral step, then follow with the trailing foot without letting the band go slack.
  - title: Stay low
    detail: Hold the squat depth for every step, then repeat the set in the other direction.
safetyNotes: >-
  Keep the knees pushed out against the band the entire set — letting them collapse inward trains exactly the pattern
  you are trying to fix. Band above the knees is gentler on the joints than at the ankles.
