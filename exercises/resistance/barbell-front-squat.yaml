id: lib-1788127148115-d9x0nn
name: Barbell Front Squat
description: >-
  Bar racked on the front delts — more upright torso, more quad and upper-back demand. The front rack forces the elbows
  high and the trunk vertical, making it the squat that punishes any lapse in bracing. Loosen your grip to fingertips if
  wrist mobility limits the rack position.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Quadriceps
secondaryMuscles:
  - Glutes
  - Abs
  - Back
  - Shoulders
equipment:
