modality: resistance
metValue: 6
instructions:
  - title: Build the rack
    detail: Rest the bar across your front delts with elbows driven high and upper arms parallel to the floor.
  - title: Unrack and set
    detail: Stand the bar off the pins and take a shoulder-width stance with toes slightly out.
  - title: Stay vertical
    detail: Squat straight down between the hips while keeping the elbows up the entire descent.
  - title: Drive the elbows
    detail: Stand up by pushing the floor away and leading with the elbows, not the hips.
safetyNotes: >-
  If the elbows drop, the bar rolls forward and the upper back rounds under load — dump it forward onto the pins rather
  than fighting to save it. Wrist or lat tightness that prevents a real rack position needs fixing before the weight
  goes up.
