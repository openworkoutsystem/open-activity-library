id: lib-1788127163688-3911zo
name: Barbell Hang Clean
description: >-
  From mid-thigh, an explosive hip extension pulls the bar up into a catch at the shoulders. It builds power without the
  floor pull, which makes it the easier place to learn the catch. Jump and shrug first — the arms only guide the bar
  into the rack.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
  - Traps
secondaryMuscles:
  - Quadriceps
  - Shoulders
