modality: resistance
metValue: 6
instructions:
  - title: Set the hang
    detail: Deadlift the bar up, then hinge it down to mid-thigh with a flat back.
  - title: Jump and shrug
    detail: Extend the hips and knees explosively while shrugging the bar upward.
  - title: Pull under
    detail: Drop into a quarter squat as the elbows whip around the bar.
  - title: Catch in rack
    detail: Receive the bar on the front delts with elbows high, then stand tall.
safetyNotes: >-
  Front-rack mobility comes first — if the elbows can't get up, the wrists take the catch. Use bumper plates and be
  willing to dump the bar forward on a missed rep.
