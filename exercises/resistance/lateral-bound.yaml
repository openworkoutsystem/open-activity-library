id: lib-1788127165438-sanptt
name: Lateral Bound
description: >-
  Push off one leg and land balanced on the other, bounding sideways. This is frontal-plane power the straight-ahead
  jump family never touches — glute med and ankle stability under real force. Stick each landing for a beat before
  pushing back the other way.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Abductors
secondaryMuscles:
  - Quadriceps
  - Hamstrings
  - Calves
equipment: []
tags:
  - Plyometrics
  - High-Impact
  - No Equipment
  - Agility Drills
modality: resistance
metValue: 8
instructions:
  - title: Load one leg
    detail: Shift your weight onto the outside leg and dip.
  - title: Bound sideways
    detail: Push off hard and travel laterally.
  - title: Stick the landing
    detail: Land on the opposite foot and hold for a beat.
  - title: Rebound back
    detail: Push off the other way and keep alternating.
safetyNotes: >-
  The single-leg landing is both the point and the risk — a knee caving inward means the bound is too far. Widen the
  distance gradually and hold every landing before chasing range.
