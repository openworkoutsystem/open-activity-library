modality: resistance
metValue: 3.5
instructions:
  - title: Set the seat height
    detail: Face the pad and raise or lower the seat until the handles line up with your shoulders when you reach forward.
  - title: Plant against the pad
    detail: >-
      Sit chest-down with your sternum on the pad and feet flat, then take the handles with a neutral grip and elbows
      slightly bent.
  - title: Sweep out and back
    detail: >-
      Pull the handles apart in a wide arc until your arms are in line with your shoulders, keeping the elbow angle
      fixed and the neck relaxed.
  - title: Return slowly
    detail: >-
      Take two seconds letting the arms come back together in front of you, allowing a light stretch across the upper
      back before the next rep.
safetyNotes: >-
  Pulling past shoulder line or bending the elbows to muscle the weight back turns this into a row and shifts the work
  to the traps - shorten the range and drop the load instead. Keep your chest on the pad; pushing off it to swing the
  handles is how the lower back gets involved on a move that should not touch it.
