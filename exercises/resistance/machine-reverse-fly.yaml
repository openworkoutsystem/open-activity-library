id: lib-1788215814452-re17n5
name: Machine Reverse Fly
description: >-
  Sit chest-down against the pad of a reverse pec deck and sweep the handles out and back until your arms are level with
  your shoulders. Because the machine supports your torso, nothing leaks into momentum or lower back fatigue, so the
  rear delts get worked at loads a dumbbell version rarely allows. Think of pulling your elbows apart, not squeezing
  your shoulder blades.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Rear Delts
secondaryMuscles:
  - Rhomboids
  - Traps
  - Rotator Cuff
equipment:
  - weight_machines
tags:
  - Isolation
