modality: resistance
metValue: 8
instructions:
  - title: Grip false
    detail: Hang from the bar with a slightly-over-the-top false grip, hands about shoulder width.
  - title: Pull explosively
    detail: Drive the bar down toward your hips, pulling your chest as high as possible.
  - title: Transition over
    detail: Lean your shoulders forward over the bar as your wrists roll on top of it.
  - title: Press out
    detail: Push down through straight-bar dip position until your arms lock out above the bar.
  - title: Lower controlled
    detail: Reverse through the transition and descend to a dead hang without dropping.
safetyNotes: >-
  Band a spotter or use a low bar for your first attempts — a failed transition can pitch you forward off the bar. Own
  strict high pull-ups and deep straight-bar dips before chasing the full movement.
