id: lib-1788131480258-a0mnd9
name: Muscle-Up
description: >-
  A pull-up that keeps going — over the bar and into a dip on top. It chains the strongest pull and push patterns into
  one rep, training the lats, chest, and triceps through the tricky transition between them. Pull the bar to your
  sternum and lean forward over it rather than pulling straight up into it.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Back
  - Chest
  - Triceps
secondaryMuscles:
  - Shoulders
  - Biceps
  - Forearms
  - Abs
equipment:
  - pull_up_bar
tags:
  - Calisthenics
