id: lib-1788127155929-qb4v28
name: T-Bar Row
description: >-
  Straddle a landmine bar and row it to your chest with a V-handle. The strength curve suits heavy loading, which is why
  it has always been a thickness builder for the mid-back and lats. Keep the hips down and let the chest — not the lower
  back — meet the weight.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Back
  - Rhomboids
secondaryMuscles:
  - Biceps
  - Rear Delts
  - Lower Back
  - Forearms
equipment:
  - barbell
  - weight_plates
tags:
  - Pull
