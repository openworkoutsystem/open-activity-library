  - Compound
  - Strength
modality: resistance
metValue: 5
instructions:
  - title: Load and straddle
    detail: Anchor one end of the bar, load plates on the other, and straddle it with the V-handle under the collar.
  - title: Hinge and grip
    detail: Push the hips back into a strong hinge with the arms straight.
  - title: Row to chest
    detail: Pull the plates toward your chest while keeping the hips low and back flat.
  - title: Lower under control
    detail: Extend the arms fully without letting the torso rise.
safetyNotes: >-
  The hinge is loaded for the whole set — keep the hips down and the back flat, and if the torso starts pumping up and
  down, the load is too heavy. Check the landmine anchor before loading plates.
