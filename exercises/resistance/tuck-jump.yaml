id: lib-1788127165307-cic3bw
name: Tuck Jump
description: >-
  Jump maximally and pull the knees to the chest before landing quiet. A genuine fast-twitch demand — you need real
  height and a rapid tuck to make room for the legs to extend again. Reserved for athletes who already own clean squat
  jumps and silent landings.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
secondaryMuscles:
  - Hip Flexors
  - Calves
  - Abs
equipment: []
tags:
  - Plyometrics
  - High-Impact
  - No Equipment
  - Lower Body
modality: resistance
metValue: 9
instructions:
  - title: Jump maximally
    detail: Explode straight up off both feet.
  - title: Tuck the knees
    detail: Pull the knees to the chest at the peak.
  - title: Extend early
    detail: Shoot the legs back down well before landing.
  - title: Land tall
    detail: Absorb softly and reset fully before the next rep.
safetyNotes: >-
  The tuck steals time from landing preparation — extend the legs early and land tall, not crumpled. Impact volume adds
  up fast here; keep sets short and only jump fresh.
