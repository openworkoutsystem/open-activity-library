instructions:
  - step: 1
    text: >-
      Start face down on the floor, then prop yourself up on your forearms and toes, keeping your elbows directly under
      your shoulders.
  - step: 2
    text: Keep your body in a straight line from head to heels, engaging your core and glutes.
  - step: 3
    text: Hold the position without letting your hips sag or pike up, breathing steadily.
safetyNotes: >-
  Avoid letting your lower back sag or hips rise; keep your neck neutral and gaze slightly forward. Stop if you feel
  strain in your lower back. This is a bodyweight exercise - no weight load applies.
