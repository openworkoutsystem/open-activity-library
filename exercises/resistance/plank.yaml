id: lib-1772742712079-esnvad
name: Plank
description: >-
  The plank is a static core exercise that strengthens the entire core by holding a forearm push-up position. It
  improves stability and posture while engaging multiple muscle groups.
experienceLevelRecommended: beginner
schemaVersion: 1
