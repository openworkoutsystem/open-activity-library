id: lib-1774910645221-28hu4u
name: Cable Fly
description: >-
  Cable crossover fly for chest isolation. Constant tension throughout the range of motion for superior chest
  activation.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Chest
secondaryMuscles:
  - Shoulders
equipment:
  - cable_machine
tags: []
modality: resistance
metValue: 5
instructions:
  - title: Setup
    detail: Set cables at shoulder height. Grab handles and step forward into a split stance.
  - title: Start position
    detail: Arms extended out to sides with slight elbow bend, chest up.
  - title: Squeeze
    detail: Bring hands together in front of chest in a hugging motion. Squeeze at the peak.
  - title: Return
    detail: Slowly open arms back to start, feeling the stretch across chest.
safetyNotes: Use controlled motion. Don't go too heavy — focus on the squeeze and stretch.
