instructions:
  - title: Setup
    detail: >-
      Sit on the cable row machine with your feet braced against the foot platforms and knees slightly bent. Select a
      straight bar, V-bar, or rope attachment. Grasp the handle with a neutral or pronated grip, arms fully extended,
      and torso upright.
  - title: Pull
    detail: >-
      Exhale and pull the handle toward your lower chest or upper abdomen, driving elbows back past your torso. Squeeze
      your shoulder blades together at the peak contraction while keeping your chest up and back straight.
  - title: Extend
    detail: >-
      Inhale and slowly extend your arms back to the starting position, allowing your shoulder blades to fully protract
      without rounding your back or locking your elbows.
  - title: Repeat
    detail: Repeat for the desired number of repetitions, maintaining control throughout.
safetyNotes: >-
  Keep back straight and chest up; avoid rounding shoulders or using momentum. Squeeze shoulder blades together at peak
  contraction. Control the eccentric phase to prevent lower back strain.
