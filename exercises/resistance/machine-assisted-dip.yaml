modality: resistance
metValue: 4.5
instructions:
  - title: Pick your assistance
    detail: >-
      Set the stack to the amount of help you need, remembering that a higher number subtracts more bodyweight, and
      start with enough that you can control every rep.
  - title: Get on the pad
    detail: >-
      Grip the parallel bars, step or kneel onto the platform one leg at a time, and press up to a locked-out start with
      shoulders down and chest tall.
  - title: Lower to depth
    detail: >-
      Bend the elbows and descend under control until your upper arms are roughly parallel to the floor, keeping a
      slight forward torso lean and elbows tracking back.
  - title: Press back up
    detail: >-
      Drive through the palms to full extension without shrugging or bouncing out of the bottom, then reset your
      shoulders before the next rep.
  - title: Progress the load
    detail: >-
      Once you can hit the top of your rep range with clean form, reduce the assistance by five to ten pounds rather
      than adding reps forever.
safetyNotes: >-
  The bottom of a dip is a deep shoulder stretch under load - stop at parallel and do not sink until your shoulders roll
  forward past your elbows. Get on and off the platform with the bars already gripped, since stepping on before you have
  control is how people drop into the bottom position unexpectedly.
