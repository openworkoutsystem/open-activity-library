id: lib-1788215814609-tvj2mn
name: Machine-Assisted Dip
description: >-
  Kneel or stand on the counterweighted platform of an assisted dip station and press yourself up from the bars while
  the machine offsets part of your bodyweight. It is the missing rung between bench pressing and a full bodyweight dip,
  letting you train the exact pattern with clean depth long before you can do one unassisted. Remember the counterweight
  is backwards: more weight selected means more help.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Triceps
  - Chest
secondaryMuscles:
