id: lib-1788215819863-5cdwws
name: TRX Fallout
description: >-
  Hold the straps with straight arms facing away from the anchor, then let the arms travel overhead as your body falls
  forward in one line before you pull them back to your chest. It is an anti-extension core exercise - the abs fight to
  keep the low back from arching while the lats and shoulders steer the straps. Ribs down and glutes squeezed the whole
  time; if the low back arches, you went too far.
experienceLevelRecommended: intermediate
schemaVersion: 1
