modality: resistance
metValue: 4
instructions:
  - title: Take the handles
    detail: >-
      Face away from the anchor with the straps at chest height, a handle in each hand, arms straight out front and the
      body leaning slightly forward.
  - title: Brace hard
    detail: Squeeze the glutes and tuck the ribs toward the hips to set a plank from ears to heels before anything moves.
  - title: Fall forward
    detail: >-
      Let the straight arms drift up and overhead as your body falls toward the floor, going only as far as you can hold
      the plank.
  - title: Pull back to start
    detail: >-
      Drive the handles back down toward your chest with the lats, arms still straight, and reset the brace between
      reps.
safetyNotes: >-
  An arching low back is the signal you have passed your range - shorten the fallout rather than grinding out reps. Step
  the feet closer to the anchor to scale it back, and skip it altogether with an unstable or impinged shoulder.
