instructions:
  - title: Anchor the Towel
    detail: >-
      Loop a sturdy towel around a stable pole, door handle, or bar at chest height. Hold both ends firmly with an
      overhand grip, arms extended. Step back until towel is taut, feet shoulder-width, knees slightly bent. Lean back
      slightly, engaging core for full-body tension.
  - title: Retract Shoulders
    detail: >-
      Pull body toward anchor by bending elbows and retracting shoulder blades, squeezing upper back. Keep elbows close
      to body, pulling until chest nears hands. Inhale during pull to stabilize. Maintain straight line from head to
      heels.
  - title: Controlled Release
    detail: >-
      Slowly extend arms to return to start, resisting the pull with back muscles. Exhale as you extend. Avoid shrugging
      shoulders or arching back; focus on controlled eccentric phase for 3 seconds.
  - title: Form and Breathing
    detail: >-
      Keep core braced and body rigid like a plank. Head neutral, eyes on anchor. Perform 10-15 reps. Breathe: inhale on
      pull, exhale on release. Adjust foot position for resistance level.
  - title: Complete Set
    detail: >-
      Finish reps, then stretch back and arms. Progress by angling body more horizontally. This builds posture without
      equipment.
safetyNotes: >-
  Keep your body in a straight line and avoid shrugging your shoulders; engage your core throughout. Common errors
  include using jerky movements or not fully extending the arms.
