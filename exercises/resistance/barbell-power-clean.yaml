id: lib-1788127163813-kt64n1
name: Barbell Power Clean
description: >-
  Pull the bar from the floor and catch it high at the shoulders in a quarter squat. It's the field-sport power staple:
  triple extension, speed under the bar, and a braced catch in one rep. The bar stays close from floor to rack — brush
  the thighs, don't swing it out.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
