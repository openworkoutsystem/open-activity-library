modality: resistance
metValue: 6
instructions:
  - title: Set up over bar
    detail: Place the bar over mid-foot with hips down, back flat, and arms straight.
  - title: Pull to the thigh
    detail: Push the floor away while the bar brushes up the legs.
  - title: Explode and shrug
    detail: Snap the hips at mid-thigh and pull the bar up close to the body.
  - title: Catch high
    detail: Drop into a quarter squat with elbows through and the bar on the front delts.
  - title: Stand and reset
    detail: Stand tall, then lower the bar and reset fully before the next rep.
safetyNotes: >-
  This is a coached skill — learn the positions light and never let the bar loop away from the body. Missed reps get
  dumped forward, so use bumper plates and keep the area clear.
