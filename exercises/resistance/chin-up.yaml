modality: resistance
metValue: 8
instructions:
  - title: Grip underhand
    detail: Take a palms-facing-you grip at about shoulder width and hang with straight arms.
  - title: Pull blades down
    detail: Initiate by drawing the shoulder blades down, then pull the elbows to your ribs.
  - title: Clear the bar
    detail: Pull until your chin is over the bar without craning your neck to fake it.
  - title: Descend fully
    detail: Lower with control to a complete dead hang before the next rep.
safetyNotes: >-
  The underhand grip loads the biceps tendon and inner elbow more than a pull-up — if you feel elbow ache building
  across sessions, back off the volume or rotate in neutral-grip work. Craning the chin over the bar with the neck is
  not a completed rep.
