id: lib-1788127155072-fn7q91
name: Chin-Up
description: >-
  The pull-up with an underhand grip — palms facing you, hands about shoulder width. The supinated grip puts the biceps
  in a stronger line of pull, which is why it is usually the first bar pull people earn. Same standard applies: dead
  hang at the bottom, chin over the bar at the top.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Back
  - Biceps
secondaryMuscles:
  - Rhomboids
  - Forearms
equipment:
  - pull_up_bar
tags:
  - Pull
