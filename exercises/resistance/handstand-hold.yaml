id: lib-1788127154215-sobko1
name: Handstand Hold
description: >-
  Inverted hold with heels resting on a wall — your entire bodyweight supported on locked arms. It builds the shoulder
  stability, wrist strength, and body tension that all inverted pressing sits on top of. Push the floor away hard so the
  shoulders stay elevated, not sunk into the ears passively.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Shoulders
secondaryMuscles:
  - Traps
  - Triceps
  - Abs
  - Forearms
equipment: []
tags:
  - Isometric
  - Calisthenics
  - Bodyweight
  - Stability
  - No Equipment
modality: resistance
metValue: 4
instructions:
  - title: Kick up to the wall
    detail: Place your hands a few inches from the wall and kick one leg up until both heels rest on it.
  - title: Stack the line
    detail: Lock the elbows and stack wrists, shoulders, and hips into one straight line.
  - title: Push the floor away
    detail: Actively press through the palms so the shoulders stay tall by your ears.
  - title: Squeeze everything
    detail: Brace the abs and glutes so the body holds as one rigid piece.
  - title: Exit on purpose
    detail: Come down the way you went up — one leg at a time, before the arms fail.
safetyNotes: >-
  Have a bail-out plan before you kick up: cartwheel out to the side rather than collapsing onto your head. Come down
  while you still have arm strength left — failed holds end on the neck.
