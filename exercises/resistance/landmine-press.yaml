modality: resistance
metValue: 4.5
unilateral: optional
instructions:
  - title: Anchor the bar
    detail: Seat one end of the barbell in a landmine sleeve or wedge it securely into a corner.
  - title: Grip at the shoulder
    detail: Hold the fat end of the bar at shoulder height, elbow tucked, standing or half-kneeling.
  - title: Press the arc
    detail: Drive the bar up and away along its natural arc until the arm is straight.
  - title: Resist the return
    detail: Lower the bar back to the shoulder slowly without letting the torso twist toward it.
safetyNotes: >-
  If you improvise the anchor in a corner, check it before loading — an unanchored bar end can kick out mid-set. The
  angle is forgiving, but still keep the ribs down rather than leaning back to finish reps.
