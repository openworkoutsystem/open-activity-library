id: lib-1788127153916-znel1v
name: Landmine Press
description: >-
  Press the free end of a barbell anchored in a landmine sleeve — the bar travels a fixed arc up and forward instead of
  straight overhead. That angle is the friendliest pressing line for cranky shoulders, and the offset load quietly
  trains the trunk and serratus too. Usually done one arm at a time from a half-kneel or standing.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Shoulders
  - Front Delts
secondaryMuscles:
  - Triceps
  - Chest
  - Serratus Anterior
