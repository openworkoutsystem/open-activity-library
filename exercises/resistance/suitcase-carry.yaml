id: lib-1788127156347-tc2gx8
name: Suitcase Carry
description: >-
  Carry a heavy weight in one hand and walk with your torso dead level. The offset load makes the obliques fight lateral
  flexion on every step, building the side strength most training misses. If your shoulder starts dropping toward the
  weight, it is too heavy.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Obliques
  - Forearms
secondaryMuscles:
  - Traps
  - Abs
  - Glutes
equipment:
  - dumbbells
  - kettlebells
tags:
  - Carry
  - Functional
  - Grip
  - Core
  - Unilateral
modality: resistance
metValue: 6
unilateral: always
instructions:
  - title: Pick up one side
    detail: Deadlift a single weight with a flat back and stand tall.
  - title: Level the torso
    detail: Brace the obliques so the shoulders stay dead level.
  - title: Walk the line
    detail: Move with short steps, refusing to lean toward or away from the weight.
  - title: Switch hands
    detail: Set the weight down, swap sides, and repeat for the same distance or time.
safetyNotes: >-
  The moment the torso bends toward or away from the weight, the spine is being loaded sideways — end the set when you
  can no longer stay level. Pick up and set down with a square hinge, not a sideways lean.
trackableMetrics:
  - key: duration
    unit: seconds
    isPrimary: true
    category: movement
