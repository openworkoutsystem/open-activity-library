instructions:
  - title: Setup
    detail: Unrack barbell at shoulder height, grip slightly wider than shoulder width. Feet hip-width apart.
  - title: Brace
    detail: Take a deep breath, brace core, squeeze glutes. Bar rests on front delts.
  - title: Press
    detail: Press bar straight overhead, moving head slightly back then forward as bar passes. Lock out arms at top.
  - title: Lower
    detail: Control the bar back to shoulder height. Reset breath and repeat.
safetyNotes: Keep core braced to protect lower back. Don't lean back excessively. Start light to establish form.
