id: lib-1788215817034-05aulq
name: Flexed Arm Hang
description: >-
  Pull up to the top of a chin-up and hold there, chin above the bar and elbows locked in the bent position, for time.
  It is the isometric rung between a dead hang and a negative pull-up, building the top-end pulling strength most people
  are missing when their chin stalls below the bar. The set ends when your eyes drop below the bar, not when your arms
  straighten.
experienceLevelRecommended: intermediate
schemaVersion: 1
