modality: resistance
metValue: 4
instructions:
  - title: Set your grip
    detail: Take an underhand grip on the bar just inside shoulder width, then step or jump up until your chin clears the bar.
  - title: Lock the position
    detail: >-
      Pull your chest toward the bar and drive the elbows down and back, pinning your shoulder blades so you hang on
      your back rather than only your arms.
  - title: Brace and hold
    detail: Squeeze the glutes and abs so the legs stop swinging, breathe steadily, and keep the chin clearly above the bar.
  - title: Lower on purpose
    detail: >-
      When the chin starts to sink, resist for two more seconds, then lower under control and step down instead of
      dropping off the bar.
safetyNotes: >-
  Holding to true failure means falling off the bar with straight arms under load, so end the set while you can still
  control the descent. Keep the shoulders packed down and back - once they creep toward your ears, the hold is finished.
