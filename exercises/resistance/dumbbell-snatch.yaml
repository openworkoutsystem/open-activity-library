id: lib-1788127164069-o8eprk
name: Dumbbell Snatch
description: >-
  One dumbbell from the floor to locked out overhead in a single motion. It's the accessible entry to snatching — the
  same hip drive with no barbell mobility demands, and honest single-arm power. Keep the bell close to the body and
  punch through at the top.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
  - Shoulders
secondaryMuscles:
  - Traps
  - Forearms
  - Abs
equipment:
  - dumbbells
tags:
  - Dumbbell
