  - Functional
modality: resistance
metValue: 7
unilateral: always
instructions:
  - title: Hinge over the bell
    detail: Stand over the dumbbell and grip it with a flat back.
  - title: Drive and pull
    detail: Snap the hips and pull the dumbbell up close to the body.
  - title: Punch overhead
    detail: As it passes the head, punch the hand to a full lockout.
  - title: Lower and switch
    detail: Bring the dumbbell down with control, then switch hands.
safetyNotes: >-
  Keep the dumbbell close on the pull and punch through the catch — an arced pull ends in a jarring overhead stop. Lower
  it to the shoulder or the floor with control rather than dropping from lockout.
