id: lib-1788213140641-47gvmk
name: Standing Cable Leg Extension
description: >-
  Stand facing away from a low pulley with an ankle cuff on the working leg, thigh lifted slightly, and straighten the
  knee against the cable's backward pull. It isolates the quadriceps without a leg extension machine, and the standing
  position adds a light balance and hip-flexor demand the seated version never asks for. Light weight, strict reps, full
  squeeze at lockout.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
secondaryMuscles:
