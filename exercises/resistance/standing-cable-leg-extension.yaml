modality: resistance
metValue: 3.5
unilateral: always
instructions:
  - title: Set up the cuff
    detail: >-
      Attach an ankle cuff to a low pulley, strap it to your working ankle, and take a step forward so the cable has
      light tension with your back to the stack.
  - title: Find your balance
    detail: >-
      Hold the frame or a sturdy upright with one hand, stand tall on the support leg, and lift the working thigh
      slightly so the knee sits bent at about 90 degrees.
  - title: Extend the knee
    detail: >-
      Straighten the knee smoothly until the leg is fully extended in front of you, keeping the thigh still so the
      movement comes from the knee, not the hip.
  - title: Control the return
    detail: >-
      Take two to three seconds letting the cable bend the knee back to the start, then finish all reps before switching
      legs.
safetyNotes: >-
  Open-chain knee extension puts direct shear on the knee joint - with patellar tendon or ACL history, start very light
  and stop shy of a snapped-out lockout. Keep the weight light enough that the torso never lurches for momentum; this is
  a strict isolation move.
