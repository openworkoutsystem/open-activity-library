id: lib-1788127148706-pkx77o
name: Sumo Squat
description: >-
  Wide-stance squat, toes out — shifts emphasis to adductors and glutes. Hold a dumbbell or kettlebell at the chest or
  hanging between the legs and let the wide base take you deeper than a standard stance allows. Push the knees out over
  the toes the entire rep; a caving knee erases the point of the stance.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Adductors
  - Glutes
  - Quadriceps
secondaryMuscles:
  - Hamstrings
  - Abs
equipment:
  - dumbbells
  - kettlebells
tags:
  - Squat
  - Dumbbell
  - Kettlebell
  - Compound
  - Lower Body
modality: resistance
metValue: 4
instructions:
  - title: Take a wide stance
    detail: Step well outside shoulder width with toes turned out about 30 degrees.
  - title: Hold the weight
    detail: Let a dumbbell or kettlebell hang between your legs or hold it at your chest.
  - title: Sink straight down
    detail: Squat down between your heels while pushing the knees out over the toes.
  - title: Squeeze up
    detail: Drive through the floor and squeeze the glutes and inner thighs to stand.
safetyNotes: >-
  The wide stance stretches the adductors hard at depth — warm the groin up first and add range gradually, since a cold
  adductor strain lingers for weeks. Keep the torso vertical; leaning forward turns it into an awkward deadlift.
