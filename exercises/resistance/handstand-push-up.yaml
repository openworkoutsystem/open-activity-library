id: lib-1788131481048-lfgdv7
name: Handstand Push-Up
description: >-
  A vertical press performed upside-down with heels resting on the wall. It loads the shoulders and triceps with your
  full bodyweight, the closest bodyweight equivalent to a heavy overhead press. Stack wrists, elbows, and shoulders in
  one line and lower until the head lightly touches the floor.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Shoulders
  - Triceps
secondaryMuscles:
  - Traps
  - Serratus Anterior
  - Abs
equipment: []
tags:
  - Calisthenics
  - Bodyweight
