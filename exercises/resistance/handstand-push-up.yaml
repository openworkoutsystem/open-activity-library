  - Balance
modality: resistance
metValue: 8
instructions:
  - title: Kick to wall
    detail: Place hands a palm's length from the wall and kick up into a handstand with heels resting on it.
  - title: Stack the line
    detail: Lock the elbows, brace the core, and stack hips over shoulders over wrists.
  - title: Lower to touch
    detail: Bend the elbows and lower under control until the top of your head lightly touches the floor.
  - title: Press to lockout
    detail: Drive through your palms back to straight arms while keeping heels on the wall.
safetyNotes: >-
  Never let the head take weight — a lapse in control here loads the neck and cervical spine directly, so keep the
  descent slow and bail by tucking or cartwheeling out. Build volume with pike push-ups and wall holds first.
