id: lib-1788278975053-3ihvgs
name: Low-to-High Cable Chest Press
description: >-
  Set both pulleys at the lowest setting, take a staggered stance facing away from the stack, and press up and forward
  on a 30 to 45 degree diagonal until the handles meet in front of your collarbones. The upward press angle biases the
  upper chest the same way an incline bench does, so this is the standing cable answer to an incline press. Standing
  costs you load but adds a real anti-extension demand through the trunk.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
