modality: resistance
metValue: 4
unilateral: optional
instructions:
  - title: Set the pulleys low
    detail: >-
      Drop both pulleys to the bottom of the uprights and fit single handles. Pulley height is what sets the press angle
      - low for upper chest, chest height for a flat press.
  - title: Stagger and brace
    detail: >-
      Step forward out of the stack with one foot ahead of the other, lean the torso slightly into the movement, and
      brace the abs so your lower back does not arch as the cables pull back.
  - title: Press up and in
    detail: >-
      Drive the handles forward and upward on a diagonal until they meet around collarbone height, letting the elbows
      extend and the hands travel toward each other.
  - title: Return under tension
    detail: >-
      Let the cables draw your hands back down and apart to chest level over two to three seconds, keeping tension on
      the chest the whole way.
safetyNotes: >-
  Standing removes the bench's back support, so the cables will pull you into extension if the core is loose - keep the
  ribs down and go lighter than you would on an incline bench. Step back into the stack under control at the end of the
  set rather than dropping the handles.
