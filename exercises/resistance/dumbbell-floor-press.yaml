id: lib-1788215815461-h0dwpp
name: Dumbbell Floor Press
description: >-
  Lie flat on the floor with knees bent and press two dumbbells from chest height to lockout, letting the triceps touch
  down between reps. The floor cuts the bottom third of the range, which spares the shoulder joint and shifts emphasis
  onto the triceps and mid-range chest strength. It is also the go-to horizontal press when you have dumbbells but no
  bench.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Chest
  - Triceps
secondaryMuscles:
  - Front Delts
  - Abs
equipment:
