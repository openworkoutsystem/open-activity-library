modality: resistance
metValue: 4.5
unilateral: optional
instructions:
  - title: Load the position
    detail: >-
      Sit on the floor with a dumbbell beside each hip, grip both, and roll back onto your shoulder blades while pulling
      the weights onto your chest. Bend the knees and plant both feet.
  - title: Set the press
    detail: >-
      Press the dumbbells to arms length above your chest, wrists stacked over elbows, with the shoulder blades pinched
      down into the floor.
  - title: Lower to the floor
    detail: >-
      Lower under control until the backs of your upper arms rest lightly on the floor, elbows tucked at roughly 45
      degrees from your ribs.
  - title: Pause and drive
    detail: >-
      Hold that floor contact for a beat with no bounce, then press back to lockout and squeeze the chest before the
      next rep.
  - title: Exit safely
    detail: >-
      After the last rep, bring the dumbbells back to your chest, tuck your chin, and roll up to seated rather than
      dropping them overhead.
safetyNotes: >-
  Never lower the dumbbells behind your head or let them crash on the floor beside you - the roll-back entry and roll-up
  exit exist specifically to keep the load off your shoulders. If you are pressing near your limit without a spotter,
  drop the weight and add reps instead.
