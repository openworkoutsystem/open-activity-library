metValue: 4.5
instructions:
  - title: Set the rope
    detail: >-
      Attach a rope to the lowest pulley setting, straddle the cable facing away from the stack, and reach between your
      legs to grab one end of the rope in each hand.
  - title: Walk it out
    detail: >-
      Step forward until the weight lifts off the stack, set your feet a bit wider than shoulder width, and stand tall
      with arms hanging straight and knees slightly bent.
  - title: Hinge back
    detail: >-
      Push your hips straight back and let the rope travel between your legs, keeping your back flat and your shins
      vertical until you feel a strong hamstring stretch.
  - title: Drive the hips
    detail: >-
      Snap the hips forward to stand up, squeezing the glutes hard at the top with ribs down, and let your arms stay
      passive so this never becomes a row.
safetyNotes: >-
  Standing too close to the stack cuts the range short and turns the lift into a squat - walk out far enough that the
  plates never rest between reps. Keep the spine neutral on the hinge; rounding under cable tension is where lower backs
  get tweaked.
