id: lib-1788215813749-eareiq
name: Cable Pull-Through
description: >-
  Face away from a low pulley with a rope between your legs, hinge at the hips until you feel the hamstrings stretch,
  then stand up tall by driving the hips forward against the cable. It teaches the hip hinge with the resistance pulling
  backward instead of down, so beginners can learn the pattern without a loaded spine. Think hips back, not chest down.
experienceLevelRecommended: beginner
schemaVersion: 1
