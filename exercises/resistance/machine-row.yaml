id: lib-1788127155783-43uep5
name: Machine Row
description: >-
  A guided rowing pattern against the machine's fixed path. It makes mid-back overload simple — no hinge to hold and no
  balance demand — so it is a good place to push hard sets safely. Set the chest pad so your arms reach full stretch at
  the start of each rep.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
