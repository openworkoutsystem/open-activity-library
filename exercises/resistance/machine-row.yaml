modality: resistance
metValue: 3.5
instructions:
  - title: Adjust the machine
    detail: Set the seat and chest pad so the handles sit at full arm's reach.
  - title: Grip and sit tall
    detail: Take the handles with a proud chest and shoulders down.
  - title: Pull to torso
    detail: Drive the elbows back and squeeze the shoulder blades together.
  - title: Return slowly
    detail: Let the handles travel forward under control to a full stretch.
safetyNotes: >-
  Set the range so the stack never slams and the start position doesn't drag your shoulders into a painful stretch.
  Avoid rocking the torso off the pad to move heavier weight.
