instructions:
  - title: Setup
    detail: >-
      Position a barbell at upper chest height in a squat rack. Step under the bar, place it across your upper back
      (traps), gripping it shoulder-width or wider with wrists straight. Feet shoulder-width apart, toes slightly out.
  - title: Unrack
    detail: >-
      Engage your core, keep chest up, and unrack the bar by straightening your legs. Take 1-2 steps back, feet flat,
      knees tracking over toes.
  - title: Descent
    detail: >-
      Initiate the squat by pushing hips back and bending knees. Lower until hips are at or below knee level (full
      depth), keeping torso upright, weight in heels/mid-foot, and knees tracking in line with toes.
  - title: Ascent
    detail: >-
      Drive through heels to stand explosively, pushing hips forward and squeezing glutes at the top. Fully extend hips
      and knees without locking out harshly.
  - title: Repeat
    detail: Control the eccentric (lowering) phase with a 3-second tempo. Maintain neutral spine throughout.
safetyNotes: >-
  Consult a professional if you have knee, back, or hip issues. Use a spotter or safety bars for heavy loads. Avoid
  rounding the back, letting knees cave in, or partial depth. Warm up thoroughly. Stop if you feel pain in joints (vs.
  muscle burn). Beginners should master bodyweight/air squats first.
