instructions:
  - title: Setup
    detail: Bar at shoulder height in front rack position. Feet hip-width apart.
  - title: Dip
    detail: Quick shallow knee bend (quarter squat depth), keeping torso upright.
  - title: Drive
    detail: Explosively extend legs and press bar overhead in one smooth motion.
  - title: Lockout
    detail: Lock arms out overhead, bar over mid-foot. Lower under control back to shoulders.
safetyNotes: Keep the dip shallow and fast. Don't press early before legs drive. Brace core throughout.
