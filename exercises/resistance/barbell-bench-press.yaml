instructions:
  - title: Setup
    detail: >-
      Lie flat on a bench with eyes under the bar. Feet planted on the floor, slight arch in lower back, shoulder blades
      squeezed back and down.
  - title: Grip & Unrack
    detail: >-
      Grip the bar slightly wider than shoulder width. Unrack the bar and hold it directly over your chest with arms
      straight.
  - title: Lowering Phase
    detail: Lower the bar slowly to your mid-chest (3 seconds). Keep elbows at about 45° from your body.
  - title: Pressing Phase
    detail: Drive the bar straight up powerfully until arms are fully extended. Squeeze chest at the top.
  - title: Breathing
    detail: Inhale as you lower the bar, exhale forcefully as you press it up.
safetyNotes: >-
  Always use a spotter for heavy sets. Keep shoulder blades retracted. Do not bounce the bar off your chest. Stop
  immediately if you feel sharp shoulder pain (especially left shoulder). Maintain control throughout the movement.
  Beginners should start with dumbbells or lighter weight.
