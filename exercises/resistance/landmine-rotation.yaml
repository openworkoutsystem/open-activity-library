id: lib-1788215815638-rwxfes
name: Landmine Rotation
description: >-
  Stand facing a barbell anchored at one end, hold the loaded sleeve with both hands at chest height, and sweep it in an
  arc from hip to hip. The long lever turns a small plate into a serious anti-rotation and rotation challenge for the
  obliques, while the shoulders and hips learn to transfer force the way they do in a throw or a swing. Rotate from the
  hips and let the back foot pivot - the lumbar spine should stay quiet.
experienceLevelRecommended: intermediate
schemaVersion: 1
