metValue: 4.5
instructions:
  - title: Anchor the bar
    detail: >-
      Wedge one end of a barbell into a landmine sleeve or a padded corner, then load a light plate on the free sleeve.
      Start with far less weight than you expect to need.
  - title: Take your stance
    detail: >-
      Face the anchor with feet slightly wider than your shoulders, and hold the sleeve just under the collar with both
      hands, arms extended at chest height.
  - title: Sweep across
    detail: >-
      Keep the arms long and sweep the bar down and across toward one hip, pivoting the opposite foot and turning the
      hips so your belt buckle follows the bar.
  - title: Reverse the arc
    detail: >-
      Drive through the hips to bring the bar back up and across to the other side in one smooth arc, resisting the urge
      to let it fall on the way down.
  - title: Count both sides
    detail: >-
      One pass to each hip is one rep. Keep the ribs stacked over the pelvis the whole set and stop when the arc starts
      collapsing.
safetyNotes: >-
  Rotation must come from the hips and thoracic spine with the pivot foot free to turn - grinding the arc with planted
  feet forces the lumbar spine to twist under load and is a common way to tweak a low back. Anyone with a disc history
  should keep this light and slow or skip it.
