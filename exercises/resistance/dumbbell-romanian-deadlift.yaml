instructions:
  - title: Setup
    detail: >-
      Stand with feet hip-width apart holding a dumbbell in each hand. Grip the dumbbells firmly with palms facing your
      thighs. Keep a slight bend in your knees and maintain a neutral spine with chest proud.
  - title: Hinge and Lower
    detail: >-
      Take a deep breath and hinge at your hips by pushing your glutes back. Keep the dumbbells close to your legs as
      you lower them toward the ground. Maintain a flat back and only bend your knees slightly.
  - title: Bottom Position
    detail: >-
      Lower until you feel a strong stretch in your hamstrings or until the dumbbells reach about mid-shin level. Keep
      your shoulders pulled back and avoid rounding your lower back.
  - title: Stand Up
    detail: >-
      Drive your hips forward to return to the starting position while squeezing your glutes at the top. Exhale as you
      stand tall. Repeat for the desired number of repetitions.
safetyNotes: >-
  Maintain a flat back and avoid rounding the spine or locking the knees. Common mistakes include using too much weight,
  leading to poor form, or bending the knees excessively like a squat.
