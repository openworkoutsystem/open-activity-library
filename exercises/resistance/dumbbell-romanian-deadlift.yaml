name: Dumbbell Romanian Deadlift
description: >-
  The Dumbbell Romanian Deadlift is a hinge-pattern strength exercise performed by holding dumbbells in front of your
  thighs, hinging at the hips with a slight knee bend, and lowering the weights while keeping a neutral spine. It builds
  strength in the hamstrings and glutes while enhancing lower-back stability and grip. This compound movement emphasizes
  controlled hip hinging for posterior chain development.
