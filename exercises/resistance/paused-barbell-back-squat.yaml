modality: resistance
metValue: 6
instructions:
  - title: Set up normally
    detail: Take your standard back squat setup and brace before the descent.
  - title: Descend under control
    detail: Lower to full depth at a deliberate pace without diving into the hole.
  - title: Hold the bottom
    detail: Pause dead still for two full seconds while keeping your air and your brace.
  - title: Drive from zero
    detail: Stand up hard with no bounce or rock to start the rep.
safetyNotes: >-
  Use roughly 10-20% less weight than your normal squat — the pause removes the bounce most lifters unknowingly rely on.
  Losing your breath during the hold collapses the brace exactly where the spine is most loaded, so exhale only after
  you're past the sticking point.
