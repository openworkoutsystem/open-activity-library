id: lib-1788127148268-e8u4rr
name: Paused Barbell Back Squat
description: >-
  Back squat with a dead stop in the hole — kills the bounce, builds position strength. Pausing removes the stretch
  reflex, so the quads and glutes have to produce force from a dead standstill in your weakest position. Count a full
  two seconds at the bottom while staying completely braced.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
