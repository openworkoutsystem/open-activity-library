id: lib-1774910675245-967tfx
name: Incline Dumbbell Press
description: >-
  Incline dumbbell bench press targeting upper chest and shoulders. Greater range of motion than barbell for balanced
  development.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Chest
  - Shoulders
secondaryMuscles:
  - Triceps
equipment:
  - dumbbells
  - bench_adjustable
tags:
  - Compound
  - Dumbbell
  - Balance
  - Barbell
modality: resistance
metValue: 6
instructions:
  - title: Setup
    detail: Set bench to 30-45 degree incline. Sit back with a dumbbell in each hand at shoulder level.
  - title: Press
    detail: Press dumbbells up and slightly inward until arms are extended. Don't clang them together at top.
  - title: Lower
    detail: Slowly lower dumbbells to chest level, elbows at ~45 degrees from torso.
  - title: Stretch
    detail: Feel the stretch at the bottom, then drive back up through the chest.
safetyNotes: Don't set incline too steep (max 45 degrees). Control the weight — don't bounce off chest.
