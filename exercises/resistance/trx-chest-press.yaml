modality: resistance
metValue: 4.5
instructions:
  - title: Set the straps
    detail: >-
      Shorten the straps to mid-length, face away from the anchor, and hold a handle in each hand with the arms extended
      in front of your chest.
  - title: Walk to your angle
    detail: >-
      Step the feet back until your body leans into the straps at a comfortable angle, remembering that more lean means
      a harder press.
  - title: Lower under control
    detail: >-
      Brace the abs and glutes, then bend the elbows to about 45 degrees from your ribs and lower until the handles are
      beside your chest.
  - title: Press back up
    detail: >-
      Drive the handles forward and slightly together until the arms are straight, keeping the body in one line and the
      straps quiet.
safetyNotes: >-
  Letting the elbows flare straight out to the sides hands the load to the shoulder joint instead of the chest - keep
  them tucked to about 45 degrees. Confirm the anchor is rated and locked before you lean any bodyweight into it.
