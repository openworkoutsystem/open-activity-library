id: lib-1788215819678-iw9r3o
name: TRX Chest Press
description: >-
  Face away from the anchor with a handle in each hand, lean forward into the straps, and press yourself back up like a
  standing push-up. Foot position sets the difficulty - walk the feet back to make it harder, step them forward to make
  it easier - so one setup serves beginners and strong pressers alike. Hold a plank from ears to heels through every
  rep, because the straps expose a sagging hip instantly.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
