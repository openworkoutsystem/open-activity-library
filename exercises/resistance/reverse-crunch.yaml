id: lib-1788131479938-c6ifjh
name: Reverse Crunch
description: >-
  Curl the hips off the floor instead of the shoulders — the crunch flipped upside down. It biases the lower portion of
  the abs and teaches posterior pelvic tilt, a skill most floor core work skips. Roll the pelvis toward the ribs rather
  than swinging the legs for momentum.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Abs
secondaryMuscles:
  - Obliques
  - Hip Flexors
equipment: []
tags:
  - Calisthenics
  - Bodyweight
  - Core
  - No Equipment
  - Low-Impact
modality: resistance
metValue: 3.8
instructions:
  - title: Load the start
    detail: Lie on your back with knees bent to ninety degrees over your hips and arms flat at your sides.
  - title: Curl the hips
    detail: Exhale and roll your pelvis up and toward your ribs, lifting the tailbone off the floor.
  - title: Pause at top
    detail: Hold the top for a beat with the knees drawn toward your chest.
  - title: Lower slowly
    detail: Uncurl the spine back down segment by segment without dropping the hips.
safetyNotes: >-
  Avoid swinging the legs to throw the hips up — momentum shifts the work to the hip flexors and jars the low back.
  Press the arms into the floor for stability instead.
