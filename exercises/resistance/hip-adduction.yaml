id: lib-1788127160834-th0qwn
name: Hip Adduction
description: >-
  Squeeze the knees together against the machine pads, working the adductors along the inner thigh. Strong adductors
  stabilize the pelvis in squats and lunges, and they are among the most commonly strained muscles in sport — direct
  work here is cheap insurance. Start conservative on the stretch setting and earn width over weeks.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
