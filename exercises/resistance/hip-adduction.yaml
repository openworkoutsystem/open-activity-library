modality: resistance
metValue: 3.5
instructions:
  - title: Set the width
    detail: Choose a start position that gives a light inner-thigh stretch, not a maximal one.
  - title: Squeeze together
    detail: Press your knees toward each other in one smooth motion.
  - title: Hold the squeeze
    detail: Pause a one-count with the pads nearly touching.
  - title: Open slowly
    detail: Resist the pads back to the start width under full control.
safetyNotes: >-
  Groin strains happen at end-range stretch under load — set the start width modestly and widen it gradually across
  sessions, never mid-set.
