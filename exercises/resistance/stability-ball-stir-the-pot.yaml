modality: resistance
metValue: 3.5
instructions:
  - title: Build the plank
    detail: >-
      Place both forearms on top of a stability ball and walk your feet back into a plank with shoulders, hips, and
      heels in one line.
  - title: Lock the brace
    detail: Squeeze the glutes, tuck the ribs down, and press the forearms into the ball until nothing is sagging or piking.
  - title: Stir the pot
    detail: >-
      Draw a slow circle about the size of a dinner plate with your forearms while the hips and shoulders stay perfectly
      still.
  - title: Reverse direction
    detail: Finish your reps in one direction, then run the same number of circles the other way before you rest.
safetyNotes: >-
  Stop the set the moment the hips sag or the low back arches mid-circle, since that is where the spine takes the load
  instead of the abs. Set the ball against a wall for the first few sessions so it cannot squirt out from under you.
