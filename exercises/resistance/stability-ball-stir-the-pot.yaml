id: lib-1788215820023-aw066u
name: Stability Ball Stir-the-Pot
description: >-
  Set your forearms on a stability ball in a plank and draw slow circles with the elbows while the rest of your body
  stays completely still. The moving support turns a static plank into a rolling anti-rotation challenge, so the deep
  core has to resist force from a new direction every few inches. Start with small circles - a shaking plank means the
  circle is bigger than your control.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Abs
  - Obliques
  - Transverse Abdominis
secondaryMuscles:
