instructions:
  - title: Lie Down Setup
    detail: >-
      Lie on back on a mat or floor, knees bent at 90 degrees, feet flat hip-width apart. Arms at sides, palms down.
      Engage core to press lower back into ground, tilting pelvis slightly. This neutral spine protects back during
      lift.
  - title: Lift Hips
    detail: >-
      Drive through heels, squeezing glutes to lift hips toward ceiling until body forms straight line from knees to
      shoulders. Keep feet flat and knees aligned. Inhale as you initiate lift for controlled rise.
  - title: Hold and Squeeze
    detail: >-
      Pause at top for 1-2 seconds, maximally contracting glutes without overarching lower back. Shoulders and upper
      back stay grounded. Exhale during hold to engage deeper.
  - title: Lower Slowly
    detail: >-
      Lower hips back to start with control, taking 3 seconds to descend. Avoid touching floor fully between reps for
      constant tension. Maintain core engagement throughout.
  - title: Repetition Guidance
    detail: >-
      Perform 10-15 reps per set. Breathe steadily: inhale up, exhale down. For progression, add single-leg variation or
      hold at top longer. Stretch glutes and hamstrings post-exercise.
safetyNotes: >-
  Avoid arching your lower back at the top; keep your feet flat and knees aligned. Common mistakes include not fully
  engaging the glutes or pushing through the heels incorrectly. This is a bodyweight exercise - no weight load applies.
