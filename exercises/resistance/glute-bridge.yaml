name: Glute Bridge
description: >-
  Glute Bridges are executed by lying on your back with knees bent and feet flat, then lifting your hips toward the
  ceiling by squeezing your glutes. This exercise activates and strengthens the posterior chain for better hip stability
  and lower back support. It primarily targets the glutes, with secondary engagement of the hamstrings and core.
