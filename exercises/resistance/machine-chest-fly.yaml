modality: resistance
metValue: 3.5
instructions:
  - title: Set the seat
    detail: >-
      Adjust the seat so the handles sit level with the middle of your chest, and set the starting arms to a stretch you
      can reach without your shoulders rolling forward.
  - title: Anchor your back
    detail: >-
      Sit with your whole back and head on the pad, feet flat on the floor, and grip the handles with elbows slightly
      bent and held at that angle throughout.
  - title: Hug them together
    detail: >-
      Drive the handles toward each other in a wide arc using the chest, and pause for a beat when they meet in front of
      your sternum.
  - title: Open under control
    detail: >-
      Take two to three seconds letting the arms travel back out, stopping when you feel a firm chest stretch rather
      than chasing maximum range.
safetyNotes: >-
  Setting the start position too far back forces the shoulder into deep external rotation under load, which is the main
  injury risk on this machine - shorten the range if you feel it in the front of the shoulder. Keep the elbow angle
  fixed so the movement stays a fly and does not turn into a press.
