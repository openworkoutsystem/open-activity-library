id: lib-1788215814293-f07xtn
name: Machine Chest Fly
description: >-
  Sit in a pec deck with your back flat against the pad and bring the handles together in front of your chest in a wide
  arc. The fixed path removes all balance demand, which makes it the easiest way to train chest adduction to real
  fatigue at the end of a pressing day. Squeeze the chest together at the middle rather than jamming the handles closed
  with your hands.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
