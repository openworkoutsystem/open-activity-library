id: lib-1788215816728-n2pf1u
name: Fire Hydrant
description: >-
  On hands and knees, lift one bent knee out to the side without letting the torso tip over with it. It targets the
  gluteus medius and the hip abductors, which makes it a staple of warm-ups and hip stability work for anyone who sits
  all day or runs. Keep the supporting side heavy and still so the lift comes from the hip, not from rolling the whole
  body away.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Abductors
  - Glutes
secondaryMuscles:
  - Obliques
  - Abs
equipment: []
tags:
