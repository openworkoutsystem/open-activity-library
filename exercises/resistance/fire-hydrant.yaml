  - Mobility
modality: resistance
metValue: 3
unilateral: always
instructions:
  - title: Set the base
    detail: >-
      Start on all fours with hands under the shoulders, knees under the hips, and the spine long from the crown of your
      head to your tailbone.
  - title: Anchor the torso
    detail: Push evenly through both hands and brace the abs so your shoulders and hips stay level and square to the floor.
  - title: Open the hip
    detail: >-
      Keeping the knee bent, lift one leg out to the side until you feel the outer hip working, stopping before the
      torso starts to lean the other way.
  - title: Lower slowly
    detail: >-
      Take two seconds to bring the knee back down without resting it fully on the floor, then complete all reps on that
      side before switching.
safetyNotes: >-
  Most people cheat height by tilting the torso and rotating the low back, which turns a hip exercise into lumbar
  rotation - a smaller, honest range with level shoulders is far more effective. Pad the knees on a mat or towel if a
  hard floor is uncomfortable.
