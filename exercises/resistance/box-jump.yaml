id: lib-1788127164596-bggl3p
name: Box Jump
description: >-
  Jump onto a box and step down rather than rebounding — lower-body power with the landing stress kept low. Trains
  explosive hip and knee extension while the step-down spares the joints the eccentric abuse. Pick a height that lets
  you land in a quarter squat, not a deep crouch.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
secondaryMuscles:
  - Hamstrings
  - Calves
equipment:
  - plyo_box
tags:
  - Plyometrics
  - High-Impact
  - Lower Body
  - Functional
modality: resistance
metValue: 8
instructions:
  - title: Set the box
    detail: Choose a height you can land on in a quarter squat.
  - title: Load the jump
    detail: Hinge slightly and swing the arms back.
  - title: Jump and land
    detail: Explode up and land on the full foot with quiet knees.
  - title: Stand tall
    detail: Finish each rep fully upright on top of the box.
  - title: Step down
    detail: Step off one foot at a time instead of jumping down.
safetyNotes: >-
  Step down every rep — jumping down doubles the landing load and is where most box jump injuries happen. Scraped shins
  come from too-high boxes; pick a height you can land tall on.
