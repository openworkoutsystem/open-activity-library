id: lib-1774910650940-tk0ky8
name: Barbell Bent-Over Row
description: Bent-over barbell row for back thickness. Targets lats, rhomboids, and traps with heavy compound pulling.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Back
  - Traps
secondaryMuscles:
  - Biceps
  - Abs
equipment:
  - barbell
  - weight_plates
tags:
  - Compound
  - Barbell
modality: resistance
metValue: 6
instructions:
  - title: Setup
    detail: Stand with feet hip-width, hinge forward ~45 degrees. Grip barbell slightly wider than shoulder width.
  - title: Pull
    detail: Row the bar to your lower chest/upper belly. Drive elbows back, squeeze shoulder blades.
  - title: Hold
    detail: Pause briefly at the top, squeezing back muscles.
  - title: Lower
    detail: Control the bar back down to full arm extension. Maintain flat back throughout.
safetyNotes: Keep back flat — don't round. Brace core throughout. Start lighter to establish form.
