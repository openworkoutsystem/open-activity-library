id: lib-1788215815817-6cdojm
name: Barbell Upright Row
description: >-
  Stand holding a barbell in front of your thighs and pull it straight up the body by driving the elbows high and wide.
  It loads the side delts and upper traps together in one vertical pull, which makes it an efficient shoulder-width
  builder alongside presses and lateral raises. Lead with the elbows, not the hands, and stop the bar at chest height.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Side Delts
  - Traps
secondaryMuscles:
