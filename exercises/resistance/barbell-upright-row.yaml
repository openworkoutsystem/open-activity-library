modality: resistance
metValue: 4
instructions:
  - title: Grip the bar
    detail: >-
      Stand tall with feet hip-width apart and take an overhand grip a little wider than your shoulders, letting the bar
      rest against the front of your thighs.
  - title: Set your posture
    detail: >-
      Pull the shoulder blades down, brace the abs, and keep a soft bend in the knees so the torso stays upright through
      the whole pull.
  - title: Pull the elbows up
    detail: >-
      Drive the elbows up and out to the sides, letting the bar travel close to your body until it reaches roughly chest
      height with the elbows level with the shoulders.
  - title: Lower with control
    detail: >-
      Reverse the path slowly back to the thighs without letting the bar swing away from you, and reset your brace
      before the next rep.
safetyNotes: >-
  Pulling the bar above chest height with a narrow grip drives internal rotation at the top of the shoulder and is the
  classic upright row impingement setup - use a shoulder-width or wider grip and stop at the chest. If you feel a pinch
  in the front of the shoulder, swap to lateral raises instead of working around it.
