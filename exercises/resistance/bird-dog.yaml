id: lib-1772742712610-3u6tge
name: Bird Dog
description: >-
  The bird dog is a balance and core stability exercise performed on all fours, extending opposite arm and leg. It
  improves coordination and strengthens the posterior chain.
experienceLevelRecommended: beginner
schemaVersion: 1
