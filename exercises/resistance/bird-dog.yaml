instructions:
  - step: 1
    text: Start on all fours with hands under shoulders and knees under hips, core engaged.
  - step: 2
    text: Extend your right arm forward and left leg backward until they are parallel to the floor.
  - step: 3
    text: Hold for 2-3 seconds, then return to start and repeat with left arm and right leg.
safetyNotes: >-
  Avoid arching your lower back at the top; keep your feet flat and knees aligned. Common mistakes include not fully
  engaging the glutes or pushing through the heels incorrectly. This is a bodyweight exercise - no weight load applies.
