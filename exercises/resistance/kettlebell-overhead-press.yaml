id: lib-1788215815152-hudgso
name: Kettlebell Overhead Press
description: >-
  From a racked kettlebell at the shoulder, press the bell straight overhead without any leg drive and lock it out over
  the midline. The offset weight sits on the back of the forearm and pulls the arm out of line, so the shoulder and core
  have to work harder than a dumbbell press at the same load. Strict means strict - if your knees dip, it is a push
  press.
experienceLevelRecommended: intermediate
schemaVersion: 1
