metValue: 5
unilateral: optional
instructions:
  - title: Rack the bell
    detail: >-
      Clean or curl the kettlebell into the rack position so the handle sits diagonally in your palm and the bell rests
      on the back of your forearm against your chest.
  - title: Build tension
    detail: >-
      Stand with feet hip width, squeeze your glutes and abs hard, and pull the ribs down so the torso is a solid
      platform before you press.
  - title: Press to lockout
    detail: >-
      Drive the bell straight up, letting the wrist rotate naturally as the elbow extends, and finish with the arm
      locked and the biceps beside your ear.
  - title: Lower to rack
    detail: >-
      Pull the bell back down into the rack position under control over two seconds, keeping the wrist straight, then
      reset your brace before the next rep.
  - title: Switch arms
    detail: >-
      Complete all reps on one side, pass the bell to the other hand, and match the count so both shoulders get the same
      work.
safetyNotes: >-
  A collapsed wrist is the main issue here - keep the forearm and hand in a straight line so the bell is stacked over
  the joint rather than bending it back. Do not turn a grinding rep into a leg-driven one; if the bell stalls, lower it
  to the rack and end the set rather than arching the lower back to finish.
