id: lib-1773092799229-fb1ixe
name: Superman Hold
description: >-
  Superman Holds are done by lying face down on the floor with arms extended overhead, then simultaneously lifting your
  arms, chest, and legs off the ground while squeezing your back and glutes. This isometric exercise strengthens the
  posterior chain and core for better posture and stability. It primarily targets the lower back and glutes.
