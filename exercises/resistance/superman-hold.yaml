instructions:
  - title: Starting Position
    detail: >-
      Lie face down on a mat with your legs straight and arms extended overhead, palms facing down. Keep your neck in a
      neutral position by looking at the floor.
  - title: Lift Phase
    detail: >-
      Simultaneously raise your arms, chest, and legs a few inches off the floor by contracting your lower back, glutes,
      and upper back muscles. Squeeze your shoulder blades together and keep your core engaged.
  - title: Hold Phase
    detail: >-
      Hold the elevated Superman position for the desired time (typically 3-5 seconds per rep), breathing steadily.
      Focus on keeping your arms and legs straight without bending at the elbows or knees.
  - title: Return Phase
    detail: >-
      Slowly lower your arms, chest, and legs back to the starting position in a controlled manner. Rest briefly before
      the next repetition.
safetyNotes: >-
  Keep your neck neutral and avoid hyperextending the spine; start with short holds if you're a beginner. Common errors
  include looking up too much or lifting only the legs without engaging the upper body.
