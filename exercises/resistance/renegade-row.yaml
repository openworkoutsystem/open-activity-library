modality: resistance
metValue: 5
unilateral: always
instructions:
  - title: Set the plank
    detail: >-
      Place two hex dumbbells shoulder-width apart on the floor, grip them, and step back into a high plank with wrists
      stacked under the shoulders.
  - title: Widen the base
    detail: >-
      Take your feet wider than your hips, squeeze the glutes, and brace the abs so the body forms one line from head to
      heels.
  - title: Row one side
    detail: >-
      Shift weight slightly into the supporting hand and row one dumbbell to your ribs, driving the elbow back rather
      than flaring it out.
  - title: Stay square
    detail: >-
      Keep both hips level and pointed at the floor as you lower the dumbbell - if a hip rotates upward, the weight is
      too heavy.
  - title: Alternate cleanly
    detail: Set the dumbbell down, reset your brace, and row the other side. One row per arm counts as one rep.
safetyNotes: >-
  Use flat-sided hex dumbbells only - round dumbbells can roll out from under a loaded wrist. Wide feet and a slow tempo
  keep the low back from arching as the torso fights rotation, and anyone with wrist pain should use push-up bars or
  skip the loaded version.
