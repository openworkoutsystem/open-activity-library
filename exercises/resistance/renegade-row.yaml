id: lib-1788215816159-y01yv0
name: Renegade Row
description: >-
  Hold a high plank on two dumbbells and row one to your ribs while the rest of your body refuses to twist. It trains
  the back and the anti-rotation core at the same time, so you get a pulling stimulus and a hard plank in one movement.
  The row is the easy part - keeping the hips square is the actual exercise.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Back
  - Abs
secondaryMuscles:
