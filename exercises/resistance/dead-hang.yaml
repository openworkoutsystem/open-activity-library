id: lib-1788127154503-mc5vc3
name: Dead Hang
description: >-
  Hang from the bar with straight arms and let gravity do the rest — grip work, shoulder decompression, and the first
  step toward a pull-up. Time under the bar builds the forearm endurance and comfortable overhead position every
  vertical pull depends on. Start passive, then learn to pull the shoulders down slightly for an active hang.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Forearms
secondaryMuscles:
  - Back
  - Shoulders
  - Rotator Cuff
equipment:
  - pull_up_bar
tags:
  - Isometric
  - Grip
  - Bodyweight
  - Pull
  - Calisthenics
modality: resistance
metValue: 2.8
instructions:
  - title: Grip the bar
    detail: Take an overhand grip just outside shoulder width and step off the support.
  - title: Hang long
    detail: Let your arms straighten fully and your body hang still beneath the bar.
  - title: Breathe steadily
    detail: Keep breathing normally instead of holding your breath against the grip effort.
  - title: Dismount with control
    detail: Step back onto the support or land softly with bent knees — do not just let go and drop.
safetyNotes: >-
  A fully passive hang bothers some shoulders — if yours pinches, pull the shoulder blades down slightly into an active
  hang instead. Land deliberately with bent knees; most hang injuries are careless dismounts, not the hang itself.
