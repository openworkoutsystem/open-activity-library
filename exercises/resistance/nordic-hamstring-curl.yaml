metValue: 5
instructions:
  - title: Anchor the ankles
    detail: Kneel on padding with your heels wedged firmly under a loaded bar, pad, or partner's hands.
  - title: Set a straight line
    detail: Squeeze the glutes so your body forms one rigid line from knees to head.
  - title: Lower by the hamstrings
    detail: Lean forward as slowly as you can, resisting the fall with the backs of your thighs.
  - title: Catch and press
    detail: Land softly on your hands in a push-up position at the bottom.
  - title: Assist the return
    detail: Push off the floor with your arms while the hamstrings pull you back to kneeling.
safetyNotes: >-
  The eccentric load here is enormous — expect severe soreness the first weeks, and start with a few assisted reps
  rather than full sets. Pad the knees and make certain the ankle anchor cannot slip mid-rep.
