id: lib-1788127160552-kfegp1
name: Nordic Hamstring Curl
description: >-
  Kneel with the ankles anchored and lower the entire body toward the floor using nothing but the hamstrings, catching
  yourself with the hands at the bottom. It is the gold-standard eccentric hamstring exercise, with strong evidence for
  reducing hamstring-strain risk in sprinting athletes. Almost nobody can do a full rep at first — fight the descent as
  long as possible and push back up with the arms.
experienceLevelRecommended: advanced
