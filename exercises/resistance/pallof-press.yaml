id: lib-1788127157286-a1vo29
name: Pallof Press
description: >-
  Standing side-on to a cable or band, you press the handle straight out and refuse to let the tension twist you. It is
  the purest anti-rotation drill there is — the further the hands travel from the chest, the harder the obliques work.
  Nothing moves except the arms.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Obliques
  - Transverse Abdominis
secondaryMuscles:
  - Abs
  - Shoulders
equipment:
  - cable_machine
  - resistance_bands
tags:
  - Core
  - Isometric
  - Stability
  - Resistance
modality: resistance
metValue: 3.5
unilateral: always
instructions:
  - title: Set the anchor
    detail: Stand side-on to a chest-height cable or band with the handle held at your sternum.
  - title: Find your stance
    detail: Step out until the line has tension, feet shoulder width, knees soft.
  - title: Press straight out
    detail: Extend both arms directly in front of the chest without letting the torso rotate toward the anchor.
  - title: Pause and return
    detail: Hold the extended position for a beat, then bring the handle back to the chest.
  - title: Switch sides
    detail: Complete all reps, then face the other way and repeat.
safetyNotes: >-
  Pick a load you can press without the shoulders shrugging or the hips shifting — if the torso twists at all, it is too
  heavy. This is a control exercise, not a strength contest.
