instructions:
  - title: Setup
    detail: >-
      Position a low pull-up bar, rings, or suspension trainer (e.g., TRX) at a height where your body will be at a
      45-degree angle or horizontal when lying underneath. Lie on your back under the bar/handles, grab with an overhand
      grip slightly wider than shoulder-width, and extend your arms fully. Lift your hips so your body forms a straight
      line from heels to shoulders, with heels on the ground and core engaged.
  - title: Pull
    detail: >-
      Pull your chest toward the bar by retracting your shoulder blades, squeezing your upper back, and driving your
      elbows back toward your hips. Keep your body rigid like a plank—do not let your hips sag or use momentum.
  - title: Lower
    detail: >-
      Slowly lower yourself back to the starting position by extending your arms fully, maintaining control and tension
      in your back throughout.
safetyNotes: >-
  Maintain a straight body line from head to heels; engage core to avoid sagging hips. Retract scapulae without
  shrugging shoulders. Progress gradually to prevent strain on wrists or elbows.
