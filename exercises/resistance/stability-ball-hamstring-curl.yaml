modality: resistance
metValue: 4
unilateral: optional
instructions:
  - title: Set your heels
    detail: >-
      Lie face up with your arms flat at your sides and both heels on top of the ball, legs straight and about hip-width
      apart.
  - title: Bridge the hips
    detail: >-
      Press through the heels and lift the hips until shoulders, hips, and heels form one straight line, then hold that
      height.
  - title: Curl the ball in
    detail: Bend the knees and drag the ball toward your glutes with your heels, keeping the hips lifted as the knees fold.
  - title: Roll out slowly
    detail: >-
      Take about three seconds straightening the legs back out without letting the hips drop, then start the next rep
      from the bridge.
safetyNotes: >-
  Hamstring cramping is common in the first few sessions - shorten the range and build volume gradually instead of
  pushing through a locked cramp. Roll out only as far as you can hold the bridge, because a dropping hip shifts the
  load straight to the low back.
