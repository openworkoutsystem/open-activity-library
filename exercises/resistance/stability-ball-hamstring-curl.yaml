id: lib-1788215819523-uef2jx
name: Stability Ball Hamstring Curl
description: >-
  Lie on your back with your heels on a stability ball, bridge the hips up, then bend the knees to roll the ball in
  toward your glutes and control it back out. Unlike a machine curl it trains knee flexion and hip extension together
  while the ball exposes any loss of control, which is why it shows up constantly in home and rehab programming. Hold
  the hips high the entire set - the moment they sag, the hamstrings stop working.
experienceLevelRecommended: intermediate
schemaVersion: 1
