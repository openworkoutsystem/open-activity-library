id: lib-1788127149067-3ch1ol
name: Hack Squat
description: >-
  Machine squat on a fixed track — quad-focused with the back supported. The angled sled removes the balance demand,
  letting you take the quads close to failure safely. Foot placement steers the emphasis: lower on the platform hits
  more quad, higher shifts toward the glutes.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Quadriceps
secondaryMuscles:
  - Glutes
  - Hamstrings
  - Calves
equipment:
  - weight_machines
tags:
  - Squat
