modality: resistance
metValue: 5
instructions:
  - title: Load and position
    detail: Set your shoulders under the pads with your back flat against the sled.
  - title: Place your feet
    detail: Put feet shoulder-width on the platform, lower for quads or higher for glutes.
  - title: Unlock and descend
    detail: Release the handles and lower until your thighs pass parallel.
  - title: Drive up
    detail: Press through the whole foot to just short of knee lockout.
safetyNotes: >-
  The fixed track means your knees can't self-adjust — if your knees hurt at depth, change foot position or cut range
  rather than pushing through. Know where the safety catches are before your first heavy set.
