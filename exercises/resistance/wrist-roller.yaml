instructions:
  - title: Load the roller
    detail: >-
      Thread a light plate onto the rope, tie it off, and let the full length of rope hang from the handle. Stand tall
      and hold the handle in both hands with an overhand grip, arms extended in front of you at shoulder height.
  - title: Wind it up
    detail: >-
      Roll the handle by alternating wrists - one hand turns it through its full range while the other regrips - so the
      rope wraps around the handle and the plate climbs steadily. Keep the elbows locked and the movement in the wrists
      only.
  - title: Reach the top
    detail: >-
      Keep winding until the plate touches the handle. That full climb is one rep - a bigger plate means fewer, harder
      reps, a longer rope means more turns per rep.
  - title: Unwind under control
    detail: >-
      Reverse the wrist action to lower the plate all the way back down without letting the handle spin free. Rolling
      the top of the handle toward you loads the wrist extensors and away from you loads the flexors, so lowering counts
      just as much as raising.
safetyNotes: >-
  The arms-out hold usually fatigues the shoulders before the forearms give out - resting the handle on a rack's J-hooks
  or safety pins, or working with the elbows bent, takes the shoulders out of it. Never let the plate free-fall and
  unspool the rope, which whips the handle and can drop the plate on a foot. Like wrist curls, the wrists tolerate reps
  far better than load, so add rope length or reps before adding plate weight.
