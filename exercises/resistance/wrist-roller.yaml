id: lib-1788297353961-b9h7vj
name: Wrist Roller
description: >-
  Hold a short handle at shoulder height with both arms extended and wind a rope up around it, hand over hand, until the
  plate hanging from the rope reaches the handle - then unwind it just as deliberately. Every turn of the handle is a
  full-range wrist flexion or extension under load, so a single roll-up packs in far more forearm work than a set of
  wrist curls. It is the classic grip and forearm finisher, and the plate creeping upward is the whole rep count.
