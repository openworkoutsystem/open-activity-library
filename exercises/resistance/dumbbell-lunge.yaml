id: lib-1774910692177-qrb703
name: Dumbbell Lunge
description: Walking or stationary lunges with dumbbells for unilateral leg strength, balance, and glute activation.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
secondaryMuscles:
  - Hamstrings
  - Abs
equipment:
  - dumbbells
tags:
  - Compound
  - Dumbbell
  - Balance
  - Strength
  - Walking
modality: resistance
metValue: 6
unilateral: always
instructions:
  - title: Setup
    detail: Hold dumbbells at sides, stand tall with feet hip-width apart.
  - title: Step
    detail: Step forward with one leg, lowering until both knees are at ~90 degrees.
  - title: Drive
    detail: Push through front heel to return to standing or step the back foot forward.
  - title: Alternate
    detail: Repeat on the other leg. Keep torso upright throughout.
safetyNotes: Keep front knee tracking over toes — don't let it cave in. Maintain upright torso.
