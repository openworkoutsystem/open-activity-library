id: lib-1788127157987-oytfk5
name: Hanging Leg Raise
description: >-
  From a hang, straight legs rise to horizontal or higher with zero swing. It is advanced anterior-chain strength — long
  levers, loaded flexion, and grip all taxed at once. The pelvis curling up at the top is the difference between ab work
  and a hip-flexor swing.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Abs
  - Hip Flexors
secondaryMuscles:
  - Forearms
  - Back
  - Obliques
equipment:
  - pull_up_bar
tags:
  - Core
