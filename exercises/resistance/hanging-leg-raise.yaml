  - Grip
  - Calisthenics
modality: resistance
metValue: 4
instructions:
  - title: Hang engaged
    detail: Grip the bar and set a light lat engagement so the shoulders are not passive.
  - title: Raise straight legs
    detail: Lift both legs together, knees locked, until they reach at least horizontal.
  - title: Curl the pelvis
    detail: Finish the rep by tilting the pelvis up toward the ribs at the top.
  - title: Lower dead slow
    detail: Control the descent fully so the body never begins to swing.
safetyNotes: >-
  Master the hanging knee raise for clean sets of ten before attempting straight legs — bailing on control here means
  hard swinging on the shoulders. Kipping the reps trains nothing but momentum.
