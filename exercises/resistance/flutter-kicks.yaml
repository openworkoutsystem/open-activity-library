id: lib-1788131479777-zwr7hb
name: Flutter Kicks
description: >-
  Small alternating leg kicks performed with the low back pinned to the floor. They train the lower abs and hip flexors
  isometrically while the legs cycle, building the bracing endurance that carries over to leg raises and L-sits. The
  work lives in keeping the lumbar spine glued down, not in kicking big.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Abs
secondaryMuscles:
  - Hip Flexors
  - Quadriceps
  - Transverse Abdominis
equipment: []
tags:
  - Calisthenics
  - Bodyweight
  - Core
  - No Equipment
modality: resistance
metValue: 3.8
instructions:
  - title: Pin the back
    detail: Lie on your back, press your low back into the floor, and hover both legs a few inches up.
  - title: Start kicking
    detail: Kick the legs up and down in small alternating pulses from the hips.
  - title: Stay braced
    detail: Keep the ribs down and abs tight so the low back never peels off the floor.
  - title: Finish clean
    detail: Lower both legs together only after the last rep, keeping tension to the end.
safetyNotes: >-
  If the low back arches off the floor, raise the legs higher or slide your hands under your hips — kicking low with a
  lifted lumbar spine is how this exercise irritates backs.
