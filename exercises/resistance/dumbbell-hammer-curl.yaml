id: lib-1774910686753-tk5pcb
name: Dumbbell Hammer Curl
description: Hammer curls with neutral grip for biceps and brachialis. Builds arm thickness and forearm strength.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Biceps
secondaryMuscles:
  - Forearms
equipment:
  - dumbbells
tags:
  - Dumbbell
  - Strength
modality: resistance
metValue: 4
unilateral: optional
instructions:
  - title: Setup
    detail: Stand with dumbbells at sides, palms facing each other (neutral grip).
  - title: Curl
    detail: Curl both dumbbells up keeping palms facing in throughout. Elbows stay at sides.
  - title: Squeeze
    detail: Squeeze at the top, then lower under control.
  - title: Tempo
    detail: 2 seconds up, 3 seconds down. Don't swing.
safetyNotes: Don't swing the weight. Keep elbows pinned to sides. Use controlled tempo.
