modality: resistance
metValue: 4.5
instructions:
  - title: Get on the ball
    detail: >-
      Start in a push-up position with hands under the shoulders and walk your feet back until the shins rest on top of
      the ball.
  - title: Set the plank
    detail: Push the floor away to spread the shoulder blades, brace the abs, and hold a straight line from head to heels.
  - title: Pike the hips
    detail: >-
      Pull the hips up and back toward the ceiling, letting the ball roll toward your toes until the body forms an
      upside-down V.
  - title: Roll back out
    detail: Lower the hips under control back into a straight plank and end the rep before the low back sags.
safetyNotes: >-
  Full bodyweight lands on the wrists and shoulders over an unstable base, so build up with ball knee tucks first and
  skip this with a wrist or shoulder injury. Work on a mat or near a wall the first time, since a ball that slips out
  drops you onto your hands and face.
