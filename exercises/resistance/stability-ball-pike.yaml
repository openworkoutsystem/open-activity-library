id: lib-1788215820183-73hzc9
name: Stability Ball Pike
description: >-
  From a push-up position with your shins on a stability ball, pull the hips straight up until the body folds into an
  inverted V, then roll back out to the plank. It is the advanced end of the ball core progression: the abs and hip
  flexors do the folding while the serratus and shoulders hold you up over a rolling base. Drive the hips up first and
  let the ball follow, instead of kicking the feet toward your hands.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Abs
  - Hip Flexors
  - Serratus Anterior
secondaryMuscles:
