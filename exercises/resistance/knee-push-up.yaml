instructions:
  - title: Kneeling Plank Setup
    detail: >-
      Start on all fours, then lower to knees, placing hands slightly wider than shoulders. Extend legs back but keep
      knees on ground, forming a straight line from head to knees. Engage core, tuck pelvis, and look down to maintain
      neutral neck.
  - title: Lower Body
    detail: >-
      Bend elbows to lower chest toward floor, keeping body straight. Elbows angle back at 45 degrees. Inhale as you
      descend slowly, aiming for chest to hover 1-2 inches above ground. Avoid sagging hips.
  - title: Push Upward
    detail: >-
      Press through palms to straighten arms, pushing body back to start. Squeeze chest and triceps at top. Exhale
      forcefully during push. Keep movements controlled without locking elbows.
  - title: Form Cues
    detail: >-
      Maintain tight core to prevent lower back arch; shoulders over wrists. Knees should stay grounded for
      modification. Perform 8-12 reps. Breathe rhythmically to build strength.
  - title: Set Completion
    detail: >-
      Complete desired reps, then rest in child's pose. Progress to full push-ups over time. Stretch chest and shoulders
      afterward for recovery.
safetyNotes: >-
  Keep your core engaged and maintain a straight line from your head to your knees to avoid arching or sagging in the
  back. Common mistakes include flaring elbows out too wide, which can strain the shoulders, and not lowering your chest
  fully to the ground. Start with a comfortable number of reps and focus on controlled movements.
