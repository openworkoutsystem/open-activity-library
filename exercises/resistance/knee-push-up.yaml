name: Knee Push-Up
description: >-
  Knee push-ups are a modified version of the traditional push-up, performed by starting in a plank position with knees
  on the ground. This exercise primarily targets the chest, shoulders, and triceps while also engaging the core for
  stability. It serves as an excellent beginner-friendly option to build upper body strength and progress toward full
  push-ups.
