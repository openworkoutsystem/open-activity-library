id: lib-1772742712430-8w44ua
name: Russian Twist
description: >-
  The Russian twist is a dynamic core exercise that targets the obliques by rotating the torso side to side while
  seated. It enhances rotational strength and coordination.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
