instructions:
  - step: 1
    text: Sit on the floor with knees bent, feet flat, and lean back slightly while keeping your back straight.
  - step: 2
    text: Clasp hands together or hold a weight, then rotate your torso to the right, bringing hands beside your hip.
  - step: 3
    text: Rotate to the left side, moving slowly and controlled, exhaling on each twist.
safetyNotes: >-
  Perform the movement slowly to avoid bouncing; use a wall for balance if needed. Common mistakes include not fully
  extending or lowering the heels, or using momentum instead of controlled muscle contraction. This is a bodyweight
  exercise - no weight load applies.
