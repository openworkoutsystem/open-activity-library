modality: resistance
metValue: 5
instructions:
  - title: Set up braced
    detail: Unrack the bar and take your normal squat stance with a full brace.
  - title: Count the descent
    detail: Lower over a strict three-second count, keeping the bar path over mid-foot.
  - title: No pause needed
    detail: Touch depth and reverse smoothly without dropping into a bounce.
  - title: Stand normally
    detail: Drive up at regular speed and reset your breath at the top.
safetyNotes: >-
  Fatigue arrives suddenly with tempo work — the last rep's descent is where form breaks, so leave a rep in the tank
  rather than grinding. Cut the load well below your normal squat weight; the slow eccentric does the work.
