id: lib-1788127148406-b3fnr9
name: Barbell Tempo Squat
description: >-
  Back squat on a slow prescribed descent — control and time under tension. A three-to-five second lowering phase forces
  perfect positions and builds the quads and trunk without maximal loads. The descent speed is the exercise; if you
  can't keep the count, the bar is too heavy.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
