metValue: 5.5
instructions:
  - title: Hang tall
    detail: >-
      Take an overhand grip slightly wider than your shoulders and hang with the arms straight, shoulders active, and
      legs together.
  - title: Set the hollow
    detail: >-
      Pull the ribs down and squeeze the glutes to hold a hollow body position, then push down slightly on the bar to
      engage the lats.
  - title: Drive the feet up
    detail: >-
      Pull the knees and then the feet up in one motion until both toes touch the bar between your hands, keeping the
      legs as straight as your hamstrings allow.
  - title: Control the descent
    detail: >-
      Lower the legs actively rather than dropping them, and let the body pass through a tight arch so the next rep
      starts with rhythm instead of a wild swing.
  - title: End the set early
    detail: >-
      Stop the set while your grip is still solid and your toes are still reaching the bar - partial swinging reps build
      nothing but fatigue.
safetyNotes: >-
  The kipping swing loads the shoulders and low back at the bottom of every rep, so build strict hanging leg raise
  strength before linking reps, and warm the shoulders up first. Grip failure at the top of a swing means falling from
  height - chalk up, use a bar you can hang from cleanly, and keep the floor under you clear.
