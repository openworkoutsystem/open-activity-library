id: lib-1788215816876-vybbk3
name: Toes-to-Bar
description: >-
  Hang from a pull-up bar and bring both feet all the way up to touch the bar between your hands, then control the swing
  on the way down. It is a benchmark gymnastics and CrossFit movement that demands full-range hip flexion, serious grip
  endurance, and lat engagement to keep the body from swinging out of rhythm. Earn strict hanging leg raises first, then
  add the kip to link reps.
experienceLevelRecommended: advanced
schemaVersion: 1
