metValue: 3.5
instructions:
  - title: Set up kneeling
    detail: >-
      Clip a rope to a high pulley, kneel about a foot in front of the stack on a pad, and pull the rope down so your
      hands sit beside your ears with elbows tucked.
  - title: Lock the hips
    detail: >-
      Sit your hips back slightly and hold them still for the whole set so the only thing moving is your spine above the
      pelvis.
  - title: Crunch the ribs down
    detail: >-
      Exhale and round your upper back, driving your elbows toward your thighs until your abs are fully shortened and
      cramped.
  - title: Uncurl slowly
    detail: >-
      Take two to three seconds letting the cable pull you back to an upright spine, stopping just before the plates
      touch so tension never drops.
safetyNotes: >-
  Loaded spinal flexion is not for anyone with disc issues or an active lower back flare - substitute an anti-extension
  hold instead. Add weight only when you can still curl the spine segment by segment, since heavy sets tend to turn into
  hip-flexor tugging with a rigid back.
