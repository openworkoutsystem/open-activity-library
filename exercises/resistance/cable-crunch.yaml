id: lib-1788215813954-p3kdji
name: Cable Crunch
description: >-
  Kneel below a high pulley holding a rope beside your head and curl your ribs down toward your pelvis against the
  cable. It is the most practical way to load spinal flexion progressively, which bodyweight crunches cannot do once you
  can rep them out endlessly. Move the ribs, not the hips - if your butt drops toward your heels you are pulling with
  the hip flexors.
experienceLevelRecommended: beginner
schemaVersion: 1
