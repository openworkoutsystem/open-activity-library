  - Upper Body
modality: resistance
metValue: 3.5
instructions:
  - title: Grip the edge
    detail: Place your hands shoulder-width on a bench, bar, or sturdy edge.
  - title: Walk feet back
    detail: Step back until your body forms one straight line from head to heels.
  - title: Lower to the edge
    detail: Bend your elbows and lower your chest to the surface under control.
  - title: Press to lockout
    detail: Drive through your palms until your arms are fully straight.
safetyNotes: >-
  Make sure the bench or bar cannot slide before you load it — a moving surface is how these go wrong. Keep the hips
  level; sagging shifts stress into the low back.
