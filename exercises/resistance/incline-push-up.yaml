id: lib-1788127152283-bzkq6f
name: Incline Push-Up
description: >-
  Hands on a bench or bar — a scaled push-up that keeps strict form available. Raising the hands reduces the load on
  chest, shoulders, and triceps without changing the pattern, and every notch lower is a built-in progression toward the
  floor. The distinguishing cue: the plank stays just as rigid as a full push-up, only the angle changes.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
