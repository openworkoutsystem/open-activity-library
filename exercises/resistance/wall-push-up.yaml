  - Upper Body
  - Calisthenics
modality: resistance
metValue: 2.8
instructions:
  - title: Set your hands
    detail: Place both palms on the wall at shoulder height and shoulder width.
  - title: Step back
    detail: Walk your feet back until your body leans into the wall in one straight line.
  - title: Lower with control
    detail: Bend your elbows at about 45 degrees and bring your chest toward the wall.
  - title: Press away
    detail: Push through your palms until your arms are fully straight.
safetyNotes: >-
  Even at low load, letting the hips sag trains a bad pattern — keep the body one rigid line from head to heels. Step
  your feet closer to the wall if your shoulders or wrists complain.
