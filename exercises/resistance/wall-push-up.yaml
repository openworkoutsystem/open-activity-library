id: lib-1788127152144-suijs6
name: Wall Push-Up
description: >-
  Push-up against a wall — the most accessible entry to the pattern. Standing at arm's length from a wall, you press
  your body away with the same rigid line you'll use on the floor later. It trains chest, triceps, and front delts while
  the low load lets you groove strict form from day one.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Chest
secondaryMuscles:
  - Triceps
  - Front Delts
  - Abs
equipment: []
tags:
  - Push
  - Bodyweight
