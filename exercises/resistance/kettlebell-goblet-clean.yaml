id: lib-1788127162318-gqwv9a
name: Kettlebell Goblet Clean
description: >-
  Clean the bell from the floor and catch it in the goblet position at the chest. It's the gentle entry to kettlebell
  cleans — the same hip drive, with a two-hand catch that can't bang your forearm. Keep the bell close and let the hips,
  not the arms, do the lifting.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
secondaryMuscles:
  - Quadriceps
  - Forearms
  - Abs
equipment:
  - kettlebells
tags:
  - Kettlebell
  - Hinge
  - Compound
  - Functional
modality: resistance
metValue: 5
instructions:
  - title: Set the hinge
    detail: Stand over the bell, push the hips back, and grip the handle with both hands.
  - title: Drive the hips
    detail: Stand up fast and let the hip drive carry the bell upward close to the body.
  - title: Catch at chest
    detail: Guide the bell into the goblet position with the elbows tucked in.
  - title: Return with control
    detail: Reverse the path and re-set the hinge before the next rep.
safetyNotes: >-
  Keep the bell close on the way up — a wide arc flips it over and clips the wrists. Start light until the catch is
  quiet.
