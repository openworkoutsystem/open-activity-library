id: lib-1788127156215-7o43qz
name: Farmer's Carry
description: >-
  Deadlift a heavy weight in each hand and walk tall for time or distance. It trains grip, traps, and a braced core
  doing exactly the work they exist for, with almost no technique barrier. Shoulders back, ribs down, steps short — the
  weight should feel heavy but the posture should never change.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Forearms
  - Traps
  - Abs
secondaryMuscles:
  - Shoulders
  - Glutes
  - Legs
equipment:
  - dumbbells
  - kettlebells
tags:
