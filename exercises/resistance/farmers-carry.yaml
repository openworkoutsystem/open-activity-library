modality: resistance
metValue: 6.5
instructions:
  - title: Deadlift the weights
    detail: Hinge with a flat back and stand up with a weight in each hand.
  - title: Set posture
    detail: Pull the shoulders back and down with the ribs stacked over the hips.
  - title: Walk tall
    detail: Take short, quick steps in a straight line for the set distance or time.
  - title: Lower safely
    detail: Hinge with a flat back to set the weights down instead of dropping them.
safetyNotes: >-
  Pick the weights up and put them down with a flat-back deadlift — most carry injuries happen at the pick-up, not
  during the walk. Keep the walking path clear and never drop the weights near your feet.
