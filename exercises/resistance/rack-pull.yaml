modality: resistance
metValue: 6
instructions:
  - title: Set the pins
    detail: >-
      Set the safety pins or blocks in a rack so the bar sits just below, at, or just above your kneecap depending on
      where you want the overload, and load the bar evenly.
  - title: Take your stance
    detail: >-
      Stand with mid-foot under the bar, shins close, and grip just outside your knees with a double overhand or mixed
      grip.
  - title: Build tension
    detail: >-
      Push the hips back, chest up, and pull the slack out of the bar until you feel the plates load before anything
      moves.
  - title: Drive to lockout
    detail: >-
      Push the floor away and drag the bar up your thighs, finishing tall with the hips through and the shoulder blades
      pulled back - not leaned back behind them.
  - title: Return to the pins
    detail: >-
      Hinge the hips back and lower the bar under control to the pins, letting it settle fully before starting the next
      rep.
safetyNotes: >-
  Because the loads are heavier than a full deadlift, any rounding at the low back or leaning back at lockout puts a lot
  of shear and compression on the lumbar spine - keep the ribs down and stop the set the moment your back position
  slips. Set the pins so you can reach the bar without diving under it.
