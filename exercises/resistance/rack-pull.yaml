id: lib-1788215815992-zpuldp
name: Rack Pull
description: >-
  Pull a loaded barbell from pins or blocks set near knee height to a standing lockout, working only the top half of the
  deadlift. Cutting the range lets you handle loads above your full deadlift, which overloads the traps, upper back, and
  lockout portion of the hinge. Treat it as its own lift with its own bar path, not a shortened deadlift to grind
  through.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Traps
  - Lower Back
secondaryMuscles:
  - Glutes
  - Hamstrings
  - Forearms
  - Back
equipment:
