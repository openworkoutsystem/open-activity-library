id: lib-1788215817177-u934l9
name: Reverse Plank
description: >-
  Sit with your legs straight and hands under your shoulders, then press the hips up until your body forms one line from
  heels to head and hold. It is the posterior mirror of the standard plank, loading the glutes, hamstrings, and upper
  back that the face-down version leaves idle. Drive the hips high and keep the chest open instead of letting the
  shoulders round forward.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
secondaryMuscles:
  - Lower Back
  - Shoulders
  - Abs
  - Triceps
equipment: []
tags:
  - Isometric
  - Core
  - Bodyweight
  - Posterior Chain
  - No Equipment
modality: resistance
metValue: 3
instructions:
  - title: Sit and set
    detail: >-
      Sit on the floor with the legs extended and heels together, and place your palms flat behind your hips with the
      fingers pointing toward your feet.
  - title: Press the hips up
    detail: Push through the hands and heels to lift the hips until the torso and legs make one straight line.
  - title: Open the chest
    detail: Draw the shoulder blades together and keep the chin neutral rather than letting the head fall back.
  - title: Hold and breathe
    detail: Squeeze the glutes hard so the hips never sag, and hold for time with slow steady breathing.
safetyNotes: >-
  The wrists carry bodyweight in full extension here, so drop to your forearms or turn the fingers slightly outward if
  that pinches. Come down as soon as the hips start sinking instead of grinding out extra seconds with a collapsed
  position.
