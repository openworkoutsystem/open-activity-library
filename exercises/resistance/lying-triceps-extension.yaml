id: lib-1788127158956-db9s5d
name: Lying Triceps Extension
description: >-
  Lower the bar to the forehead from a bench press position — the classic "skullcrusher." Only the elbows bend; the
  upper arms stay near vertical while the bar arcs to the forehead or just behind the head. It loads the triceps heavier
  than most isolation work, which is both its value and its risk.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Triceps
secondaryMuscles: []
equipment:
  - ez_curl_bar
  - bench_flat
tags:
  - Isolation
  - Upper Body
  - Strength
  - Push
  - Weightlifting
modality: resistance
metValue: 3.5
instructions:
  - title: Set up lying
    detail: Lie on a flat bench holding the EZ bar over your chest with arms straight.
  - title: Bend at elbows
    detail: Lower the bar toward your forehead by bending only the elbows.
  - title: Hold arm angle
    detail: Keep the upper arms near vertical instead of letting them drop toward the bench.
  - title: Extend to lockout
    detail: Drive the bar back to straight arms and squeeze the triceps.
safetyNotes: >-
  This movement is notoriously hard on the elbow tendons — keep loads moderate, progress slowly, and stop the set if you
  feel elbow pain rather than pushing through. The bar path travels over your face, so control every inch of the
  descent.
