instructions:
  - title: Setup Stance
    detail: >-
      Stand with feet hip-width apart, toes pointing forward, near a wall or stable surface for balance if needed. Keep
      knees slightly bent, core engaged, and shoulders relaxed. Hold arms at sides or place hands on hips. This can be
      done on flat ground or with toes on an edge for greater range.
  - title: Lift Heels
    detail: >-
      Slowly rise onto the balls of your feet by contracting calves, lifting heels as high as possible. Keep weight
      evenly distributed across toes. Exhale during the lift for controlled ascent. Pause briefly at the top to maximize
      muscle contraction.
  - title: Controlled Lowering
    detail: >-
      Lower heels back to ground slowly, taking 3-4 seconds to resist gravity. Feel the stretch in calves at bottom.
      Inhale as you descend to maintain rhythm. Avoid bouncing; focus on smooth motion to prevent ankle strain.
  - title: Form and Repetition
    detail: >-
      Maintain straight posture without leaning; keep knees soft but not locked. Perform 10-15 reps per set. For
      variation, do single-leg raises for advanced challenge. Breathe consistently: exhale up (concentric), inhale down
      (eccentric).
  - title: Cool Down
    detail: >-
      After sets, gently stretch calves by stepping one foot back and pressing heel down. Hydrate and note any
      tightness. Progress by holding weights or increasing reps for better ankle stability.
safetyNotes: >-
  Perform the movement slowly to avoid bouncing; use a wall for balance if needed. Common mistakes include not fully
  extending or lowering the heels, or using momentum instead of controlled muscle contraction. This exercise can be done
  bodyweight or progressed with dumbbells or machines for added load.
