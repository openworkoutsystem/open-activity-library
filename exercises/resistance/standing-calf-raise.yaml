id: lib-1773096605677-uo3a49
name: Standing Calf Raise
description: >-
  Standing calf raises to target the calf muscles (gastrocnemius and soleus) for lower leg strength and development.
  Simple bodyweight exercise, progressable with added weights.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
