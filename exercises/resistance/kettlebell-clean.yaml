id: lib-1788127162439-h04w9n
name: Kettlebell Clean
description: >-
  Hike the bell back and clean it to the rack position in one crisp arc. It builds hip power and grooves the position
  every kettlebell press and squat starts from. The skill is taming the arc — keep the bell close and let it roll around
  the wrist instead of flipping over and banging the forearm.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
secondaryMuscles:
