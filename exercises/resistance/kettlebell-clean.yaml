modality: resistance
metValue: 6
unilateral: optional
instructions:
  - title: Hike the bell
    detail: Hinge at the hips and swing the bell back between the legs with one hand.
  - title: Drive and guide
    detail: Snap the hips and keep the elbow close to the ribs as the bell travels up.
  - title: Catch in rack
    detail: Let the bell roll around the wrist and settle into the rack with a straight wrist.
  - title: Re-hike and repeat
    detail: Drop the bell back into the swing arc and start the next rep.
safetyNotes: >-
  The forearm bruise is a technique error, not a rite of passage — loosen the grip and let the bell roll around the hand
  into the rack. Keep the wrist straight; a flexed wrist under a bell adds up fast.
