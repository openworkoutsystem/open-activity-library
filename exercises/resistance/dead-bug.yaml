id: lib-1772957758262-661hm8
name: Dead Bug
description: >-
  A foundational core stability exercise performed lying on your back. It strengthens the deep core muscles (transverse
  abdominis), improves coordination, and is extremely safe for the lower back and neck. Excellent for beginners to
  advanced trainees working on core control.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Transverse Abdominis
  - Abs
secondaryMuscles:
