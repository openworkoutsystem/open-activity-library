instructions:
  - title: Starting Position
    detail: >-
      Lie on your back on a mat with your arms extended straight up toward the ceiling and knees bent at 90 degrees
      (tabletop position). Press your lower back firmly into the floor.
  - title: Movement
    detail: >-
      Slowly extend your right arm straight back overhead while simultaneously extending your left leg straight out,
      hovering just above the floor. Keep your lower back pressed down and core braced.
  - title: Return
    detail: Slowly bring your right arm and left leg back to the starting tabletop position with control.
  - title: Alternate
    detail: >-
      Repeat on the opposite side, extending your left arm and right leg. Continue alternating sides in a slow,
      controlled manner.
  - title: Breathing
    detail: Exhale as you extend your arm and leg, inhale as you return to center.
safetyNotes: >-
  Keep your lower back pressed into the floor at all times — this is the most important cue. Move slowly and with
  control. Stop immediately if you feel any lower back pain or arching. Great exercise for those with lower back issues
  or tech neck. Modify by keeping knees bent and only moving arms if needed. This is a bodyweight exercise - no weight
  load applies.
