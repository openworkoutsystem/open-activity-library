  - Compound
  - No Equipment
  - Calisthenics
modality: resistance
metValue: 4
unilateral: always
instructions:
  - title: Set your stance
    detail: Stand tall with feet hip-width apart and hands on hips or at your sides.
  - title: Step forward
    detail: Take a controlled step forward long enough that both knees can bend to about 90 degrees.
  - title: Lower straight down
    detail: Drop the back knee toward the floor while keeping the torso upright and the front heel planted.
  - title: Push back
    detail: Drive through the front foot to return to standing in one strong push.
  - title: Alternate legs
    detail: Repeat on the other side, counting reps per leg.
safetyNotes: >-
  The deceleration of the forward step loads the front knee more than other lunge variations — if your knee complains,
  switch to reverse lunges. Keep the front knee tracking over the toes rather than caving inward.
