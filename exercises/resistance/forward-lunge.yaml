id: lib-1788127150848-3p7f4b
name: Forward Lunge
description: >-
  Step forward, lower the back knee toward the floor, and push back to standing — the basic split-stance builder. It
  trains the quads and glutes one leg at a time while forcing the hips to decelerate and control the step. Keep the
  front shin roughly vertical and the torso tall as you drop straight down rather than lurching forward.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
secondaryMuscles:
  - Hamstrings
  - Adductors
  - Calves
  - Abs
equipment: []
tags:
  - Lower Body
