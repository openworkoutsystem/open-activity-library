id: lib-1788131479474-jozwfq
name: Sit-Up
description: >-
  The classic full sit — shoulder blades to knees and back down under control. It trains the abs through a long range of
  motion with the hip flexors assisting the top half. Lead with the ribs curling toward the pelvis rather than yanking
  the head forward.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Abs
secondaryMuscles:
  - Hip Flexors
  - Obliques
equipment: []
tags:
  - Calisthenics
  - Bodyweight
  - Core
  - No Equipment
modality: resistance
metValue: 3.8
instructions:
  - title: Set your start
    detail: Lie on your back with knees bent, feet flat, and fingertips lightly touching your temples.
  - title: Curl up
    detail: Exhale and curl your torso up until your chest approaches your knees.
  - title: Reach the top
    detail: Sit tall for a beat with your abs still braced.
  - title: Lower with control
    detail: Roll back down one vertebra at a time until your shoulder blades touch the floor.
safetyNotes: >-
  Keep the hands light at the temples — pulling on the head strains the neck. If your low back complains, shorten the
  range to a crunch instead of anchoring the feet harder.
