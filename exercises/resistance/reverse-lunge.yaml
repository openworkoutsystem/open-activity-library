instructions:
  - title: Starting Position
    detail: >-
      Stand tall with feet hip-width apart, hands on hips or holding weights at sides. Engage core and keep gaze
      forward. Relax shoulders and ensure neutral spine. This setup promotes balance and prepares for backward step.
  - title: Step Backward
    detail: >-
      Take a controlled step back with one foot, landing on ball of foot. Lower body by bending both knees until front
      thigh is parallel to ground and back knee nearly touches floor. Inhale as you descend, keeping front knee aligned
      over toes.
  - title: Push to Return
    detail: >-
      Drive through front heel to push back up, bringing rear foot forward to starting stance. Squeeze glute and quad of
      front leg at top. Exhale during the push for power. Alternate legs or complete one side first.
  - title: Maintain Form Cues
    detail: >-
      Keep torso upright; avoid forward lean or rounding back. Ensure hips stay level and core tight for stability.
      Steps should be about 2-3 feet back. Breathe rhythmically to support endurance.
  - title: Reps and Progression
    detail: >-
      Aim for 8-12 reps per leg. Rest minimally between sides. For beginners, shorten step; advanced add dumbbells. End
      with stretches for hip flexors and quads to improve mobility.
safetyNotes: >-
  Keep your front knee tracking over your toes and maintain a straight back; avoid leaning forward. Common mistakes
  include short steps or allowing the knee to go past the toes.
