id: lib-1773096604932-su7m6r
name: Reverse Lunge
description: >-
  Reverse Lunges are performed by stepping backward with one foot into a lunge position, lowering until both knees are
  bent at about 90 degrees, then pushing back to standing. This lower-body exercise enhances leg strength, balance, and
  coordination while being joint-friendly. It targets the quadriceps, hamstrings, glutes, and calves.
