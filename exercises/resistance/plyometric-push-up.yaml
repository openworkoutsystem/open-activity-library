  - Push
  - High-Impact
modality: resistance
metValue: 8
instructions:
  - title: Brace the plank
    detail: Set a strong push-up position with hands under shoulders and body rigid.
  - title: Load the dip
    detail: Lower your chest quickly to just above the floor.
  - title: Explode up
    detail: Press with maximal intent so your hands pop off the floor at the top.
  - title: Land soft
    detail: Catch the floor with slightly bent elbows and flow straight into the next rep.
safetyNotes: >-
  The catch loads the wrists and elbows hard — land with bent arms and stop the set the moment reps lose height. Earn 20
  crisp standard push-ups before adding the jump.
