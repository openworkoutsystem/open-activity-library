id: lib-1788131480543-0kvyvb
name: Plyometric Push-Up
description: >-
  Press explosively enough that your hands leave the floor at the top. It converts pressing strength into upper-body
  power, training the chest, triceps, and shoulders to produce force fast. Think of throwing the floor away rather than
  jumping off it, and land soft with bent elbows.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Chest
  - Triceps
secondaryMuscles:
  - Shoulders
  - Abs
equipment: []
tags:
  - Calisthenics
