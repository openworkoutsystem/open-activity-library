instructions:
  - title: Starting Position
    detail: >-
      Begin in a high plank position with hands slightly wider than shoulders, fingers spread, body in a straight line
      from head to heels. Engage core and glutes.
  - title: Lower Phase
    detail: >-
      Bend elbows to lower chest toward floor, keeping elbows at 45-degree angle from body. Maintain straight body
      line—no sagging hips.
  - title: Bottom Position
    detail: Lower until chest nearly touches ground (or forearms if beginner mod). Shoulders stay retracted.
  - title: Push Phase
    detail: Press through palms to extend arms, keeping elbows close to body. Exhale as you push up.
  - title: Top Position
    detail: Fully extend arms without locking elbows. Body returns to straight plank. Repeat.
safetyNotes: >-
  Stop immediately if you feel sharp pain in your left shoulder. Keep elbows at 45° angle, core tight, and body in a
  straight line. Modify to knee push-ups or wall push-ups if needed due to shoulder pain or tech-neck. Maintain neutral
  neck position—avoid looking up or dropping your head. This is a bodyweight exercise - no weight load applies.
