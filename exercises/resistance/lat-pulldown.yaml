instructions:
  - title: Setup
    detail: >-
      Select the desired weight on the cable machine and attach a wide lat pulldown bar. Sit down and adjust the knee
      pad so it secures your thighs firmly. Grip the bar with a wide overhand grip (palms facing away), hands wider than
      shoulder-width.
  - title: Position
    detail: >-
      Keep your chest up, shoulders back, core engaged, and feet flat on the floor or foot pads. Your arms should be
      fully extended upward.
  - title: Pull
    detail: >-
      Initiate the movement by pulling your shoulder blades down and together, then pull the bar down toward your upper
      chest, leading with your elbows. Squeeze your lats at the bottom without leaning back excessively.
  - title: Return
    detail: >-
      Slowly control the bar back to the starting position by extending your arms fully, resisting the weight to
      maintain tension in the lats. Repeat for the prescribed reps.
safetyNotes: >-
  Maintain neutral spine; avoid excessive leaning back or using momentum. Keep shoulders depressed away from ears and
  lead with elbows. Use full range of motion without jerking the weight.
