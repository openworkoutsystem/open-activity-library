modality: resistance
metValue: 4
unilateral: always
instructions:
  - title: Stand tall
    detail: Set feet hip-width apart with hands at your chest for balance.
  - title: Step behind and across
    detail: Sweep one leg behind the standing leg, landing on the ball of the foot.
  - title: Lower the back knee
    detail: Bend both knees until the rear knee hovers behind the opposite heel.
  - title: Stay square
    detail: Keep the front foot flat and the chest facing forward throughout.
  - title: Return and repeat
    detail: Drive off the front leg back to standing and alternate sides.
safetyNotes: >-
  The crossed stance puts a rotational stress on the front knee — keep the range shallow at first and skip it entirely
  if you have a history of knee ligament issues. Depth is earned through control, not forced on day one.
