id: lib-1788127151433-lcvxul
name: Curtsy Lunge
description: >-
  Step behind and across the standing leg — glute med emphasis and hip control that straight-line lunges miss. The
  crossing angle loads the outer hip of the front leg hard, which is exactly what keeps knees tracking well everywhere
  else. Keep the front foot planted flat and the hips as square as the pattern allows.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Quadriceps
secondaryMuscles:
  - Abductors
  - Adductors
  - Abs
equipment: []
tags:
