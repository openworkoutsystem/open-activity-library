id: lib-1788127149219-kukop0
name: Smith Machine Squat
description: >-
  Squat on a guided bar — useful for controlled overload or training alone. The fixed bar path removes the balance
  demand so the quads and glutes can work near failure without a spotter. Set your feet slightly ahead of the bar so the
  track matches your natural squat line.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
