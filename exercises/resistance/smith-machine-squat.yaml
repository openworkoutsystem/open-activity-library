modality: resistance
metValue: 5
instructions:
  - title: Set bar height
    detail: Position the bar so you can unrack it with a slight knee bend, across your upper traps.
  - title: Step feet forward
    detail: Place your feet a few inches in front of the bar's vertical track, shoulder-width apart.
  - title: Unhook and descend
    detail: Rotate the bar to release the hooks and squat until your thighs reach parallel.
  - title: Drive and re-hook
    detail: Press up through the whole foot and rotate the bar back onto the hooks to finish.
safetyNotes: >-
  Practice the hook rotation with an empty bar first — fumbling the re-rack under fatigue is the machine's real hazard.
  The fixed path won't bend to your mechanics, so adjust foot position until the descent feels natural rather than
  forcing your knees to comply.
