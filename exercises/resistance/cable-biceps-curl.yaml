id: lib-1788127161653-patyr4
name: Cable Biceps Curl
description: >-
  A biceps curl against a cable, with tension held from bottom to top. That removes the dead spots a free-weight curl
  has at the turnarounds.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Biceps
secondaryMuscles:
  - Forearms
equipment:
  - cable_machine
tags:
  - Isolation
  - Resistance
  - Strength
  - Upper Body
modality: resistance
metValue: 3.5
unilateral: optional
instructions:
  - title: Stand over the anchor
    detail: Position the low cable between your feet and grip the handle at arm's length.
  - title: Pin the elbows
    detail: Lock your upper arms against your sides and keep them there all set.
  - title: Curl to the top
    detail: Bend the elbow fully and squeeze the biceps at peak contraction.
  - title: Lower against tension
    detail: Straighten the arm slowly, resisting the cable the whole way down.
safetyNotes: >-
  Constant tension means no rest at the bottom of the rep — the same weight feels harder than on a bar, so pick your
  load accordingly rather than heaving with the shoulders.
