id: lib-1774910681038-dz482l
name: Dumbbell Lateral Raise
description: Dumbbell lateral raises for medial delt development. Key isolation movement for wider-looking shoulders.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Shoulders
secondaryMuscles: []
equipment:
  - dumbbells
tags:
  - Dumbbell
modality: resistance
metValue: 4
unilateral: optional
instructions:
  - title: Setup
    detail: Stand with dumbbells at sides, slight bend in elbows, palms facing in.
  - title: Raise
    detail: Lift arms out to sides until parallel with floor. Lead with elbows, not hands.
  - title: Hold
    detail: Brief pause at the top. Pinky should be slightly higher than thumb.
  - title: Lower
    detail: Control the weight back down slowly. Don't swing.
safetyNotes: Use light weight. Don't shrug traps — keep shoulders down. Avoid swinging or using momentum.
