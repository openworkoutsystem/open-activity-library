metValue: 5
instructions:
  - title: Place the bench
    detail: >-
      Slide a flat bench under the bar and shift it until the bar would land on your lower chest, then load the plates
      evenly and set the safety stops just below your chest.
  - title: Set your grip
    detail: >-
      Lie back with eyes under the bar, take a grip slightly wider than shoulder width, and pull your shoulder blades
      down and together into the bench.
  - title: Unrack and descend
    detail: >-
      Rotate the hooks to unlock the bar, then lower it to your lower chest over two seconds with elbows at roughly a
      forty-five degree angle to your torso.
  - title: Press to lockout
    detail: >-
      Drive the bar straight up the track until the elbows lock, keeping your feet planted and your upper back tight on
      the bench.
  - title: Rehook safely
    detail: >-
      Finish the last rep at full lockout, rotate the bar back into the hooks, and confirm it is caught before letting
      go.
safetyNotes: >-
  The fixed bar path is forced on your shoulders whether it suits them or not - if pressing feels pinchy, move the bench
  a few inches rather than pushing through it. Always set the safety stops at chest height before your first rep, and
  confirm the hooks are engaged at the end of the set before releasing the bar.
