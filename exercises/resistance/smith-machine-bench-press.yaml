id: lib-1788215814814-566n6v
name: Smith Machine Bench Press
description: >-
  Lie on a flat bench under a Smith machine bar and press it on the machine's fixed vertical track. The guided path
  removes the balance demand of a free bar, which makes it a solid choice for training close to failure without a
  spotter or for chasing pure chest fatigue. Position the bench so the bar meets your lower chest, not your throat.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
