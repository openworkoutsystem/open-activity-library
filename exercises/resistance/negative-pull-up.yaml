id: lib-1788127154926-vordma
name: Negative Pull-Up
description: >-
  Jump or step to the top position, chin over the bar, then lower yourself as slowly as you can — building the pull-up
  through its eccentric half. You are strongest lowering, so negatives let you train the full movement before you can
  pull a single rep. Aim for a three-to-five second descent per rep.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
