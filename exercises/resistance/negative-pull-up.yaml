modality: resistance
metValue: 6
instructions:
  - title: Get to the top
    detail: Use a box or a jump to start with your chin over the bar and elbows fully bent.
  - title: Squeeze and hold
    detail: Pause a beat at the top with shoulder blades pulled down and chest toward the bar.
  - title: Lower on a count
    detail: Descend as slowly as you can, fighting for every inch over three to five seconds.
  - title: Finish at straight arms
    detail: Reach a full hang, then step back up and repeat.
safetyNotes: >-
  Slow eccentrics produce serious soreness — start with just a few quality reps per session and build up, or the first
  week will wreck your arms. When you can no longer control the descent, the set is over; free-falling the last reps
  strains the elbows and shoulders.
