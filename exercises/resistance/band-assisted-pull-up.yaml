id: lib-1788127154785-e8w69v
name: Band-Assisted Pull-Up
description: >-
  A pull-up with a resistance band looped over the bar and under the feet or knees — full range of motion with a portion
  of your bodyweight removed. The band helps most at the bottom, where you are weakest, so every rep still finishes on
  your own strength at the top. Progress by moving to thinner bands, not by adding reps forever.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Back
secondaryMuscles:
  - Biceps
  - Rhomboids
  - Forearms
equipment:
  - pull_up_bar
  - resistance_bands
tags:
  - Pull
  - Bodyweight
  - Resistance
  - Upper Body
  - Calisthenics
modality: resistance
metValue: 5
instructions:
  - title: Rig the band
    detail: Loop the band over the bar, pull it through itself, and set one foot or knee in the bottom loop.
  - title: Hang in position
    detail: Grip the bar overhand, arms straight, body steady over the band.
  - title: Pull chin over bar
    detail: Drive the elbows down toward your ribs until your chin clears the bar.
  - title: Lower all the way
    detail: Descend under control to a full straight-arm hang before the next rep.
safetyNotes: >-
  A loaded band that slips off the foot snaps upward hard — set your foot carefully and take it out deliberately at the
  end of the set, holding the band as you step free. Do not let the band tempt you into cutting the bottom of the range
  short.
