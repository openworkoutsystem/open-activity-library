id: lib-1788127160351-9z0jml
name: Seated Leg Curl
description: >-
  A hamstring curl performed sitting upright with the hips flexed, which puts the hamstrings on stretch at the start of
  every rep. That longer working length makes it the better growth stimulus of the two curl machines for most lifters.
  Set the lap pad snug so the hips can't hinge to help.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Hamstrings
secondaryMuscles:
  - Calves
equipment:
  - weight_machines
tags:
  - Isolation
  - Machine Weights
  - Lower Body
  - Posterior Chain
modality: resistance
metValue: 4
unilateral: optional
instructions:
  - title: Align the pivot
    detail: Adjust the seat so your knee joint lines up with the machine's axis of rotation.
  - title: Lock the lap pad
    detail: Cinch the thigh pad down snug so your hips cannot lift or hinge.
  - title: Curl under
    detail: Pull your heels down and under the seat as far as they will travel.
  - title: Resist the return
    detail: Let the legs straighten slowly, controlling the stretch at the top.
safetyNotes: >-
  The stretched start position is exactly where hamstrings strain — take the first rep of each set deliberately instead
  of snapping into it. Line the knee up with the machine's pivot before loading.
