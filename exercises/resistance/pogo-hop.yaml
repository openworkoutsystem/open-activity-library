id: lib-1788127165687-b1ojip
name: Pogo Hop
description: >-
  Quick, stiff-ankle bounces off the balls of the feet with barely-bent knees. Trains the Achilles and calf complex to
  store and return energy — the tendon springiness that running depends on. Think bouncing on hot pavement: short,
  springy ground contact every rep.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Calves
secondaryMuscles:
  - Tibialis Anterior
  - Quadriceps
equipment: []
tags:
  - Plyometrics
  - High-Impact
  - No Equipment
  - Warm-Up
modality: resistance
metValue: 8
instructions:
  - title: Stand springy
    detail: Set feet hip-width with knees nearly straight.
  - title: Bounce on the balls
    detail: Hop rapidly off the balls of the feet, heels barely kissing the floor.
  - title: Stay stiff
    detail: Keep the ankles rigid so the bounce comes from the tendons, not knee bend.
  - title: Keep rhythm
    detail: Hold a quick, even cadence for the full set.
safetyNotes: >-
  Ramp the volume slowly — the Achilles adapts slower than the calves feel like it does. Skip these entirely on a grumpy
  Achilles or irritated plantar fascia.
trackableMetrics:
