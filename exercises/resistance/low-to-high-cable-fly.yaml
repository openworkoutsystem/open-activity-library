metValue: 3.5
unilateral: optional
instructions:
  - title: Set the pulleys low
    detail: >-
      Drop both pulleys to the bottom of the uprights, fit single handles, and take one in each hand with your palms
      facing forward.
  - title: Stagger and set the elbows
    detail: >-
      Step forward into a staggered stance with a slight forward lean, then set a soft bend in the elbows and lock that
      angle - it stays fixed for every rep.
  - title: Sweep up and together
    detail: >-
      Draw the handles up and inward along a wide arc until they meet in front of your collarbones, squeezing the upper
      chest at the top.
  - title: Open under control
    detail: >-
      Let the arms travel back down and out over two to three seconds until you feel a stretch across the chest,
      stopping before the shoulders roll forward.
safetyNotes: >-
  The bottom of the arc is where the shoulder is most vulnerable - stop the stretch at chest level rather than letting
  the cables pull your arms behind your torso. Straightening the elbows to move more weight turns the load into a
  shoulder-joint lever, so keep it light enough to hold the fixed bend.
