id: lib-1788279083464-o9xqmg
name: Low-to-High Cable Fly
description: >-
  From two low pulleys, sweep the handles up and together in an arc until they meet in front of your collarbones,
  keeping a soft fixed bend in the elbows the whole way. Where the standard cable crossover comes down from high
  pulleys, reversing the arc puts the tension on the upper chest, so this is the isolation partner to a low-to-high
  press. The elbows never open and close - if they do, it has become a press.
experienceLevelRecommended: beginner
schemaVersion: 1
