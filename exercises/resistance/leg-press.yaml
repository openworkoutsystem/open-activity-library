id: lib-1774910663899-yw2hnq
name: Leg Press
description: Machine leg press for quad, glute, and hamstring development. Allows heavy loading with back support.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
