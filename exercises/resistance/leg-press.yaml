modality: resistance
metValue: 6
instructions:
  - title: Setup
    detail: Sit in leg press with feet shoulder-width on platform, mid-height. Back flat against pad.
  - title: Unlock
    detail: Release safety handles. Lower the platform by bending knees toward chest.
  - title: Press
    detail: Push through full foot to extend legs. Don't lock knees completely at the top.
  - title: Lower
    detail: Control the weight down until knees are at ~90 degrees. Don't let hips lift off the seat.
safetyNotes: Never lock knees at top. Don't go so deep that hips curl off the pad. Always use safeties.
