id: lib-1788127157163-6l84s6
name: Plank Shoulder Tap
description: >-
  From a high plank, you lift one hand to tap the opposite shoulder while the hips stay dead level. It adds
  anti-rotation to the plank — three points of contact instead of four, and the trunk has to refuse the twist. Wide feet
  make it easier; feet together make it brutal.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
