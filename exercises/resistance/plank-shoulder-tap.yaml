modality: resistance
metValue: 3.3
instructions:
  - title: Set high plank
    detail: Start in a push-up position with hands under shoulders and feet about hip width.
  - title: Brace the trunk
    detail: Squeeze the abs and glutes so the hips are locked in place.
  - title: Tap the shoulder
    detail: Lift one hand and touch the opposite shoulder without the hips swaying.
  - title: Alternate slowly
    detail: Return the hand and repeat on the other side at a controlled tempo.
safetyNotes: >-
  The rep is worthless if the hips rock side to side — slow down or widen the feet until they stay still. Watching your
  hips in a mirror or on video is the fastest fix.
