id: lib-1788127163191-q140y0
name: Kettlebell Halo
description: >-
  Circle the bell around the head in tight, controlled orbits, alternating directions. It warms up the shoulders, upper
  back, and grip while the core resists the moving load. Keep the circles small and close — the elbows lead and the bell
  follows.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Shoulders
secondaryMuscles:
  - Rotator Cuff
  - Traps
  - Abs
