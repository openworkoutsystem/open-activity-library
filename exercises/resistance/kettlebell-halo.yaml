  - Upper Body
modality: resistance
metValue: 3
instructions:
  - title: Grip by the horns
    detail: Hold the bell upside down by the handle at chest height.
  - title: Circle the head
    detail: Move the bell in a tight orbit around the head with the elbows leading.
  - title: Switch directions
    detail: Complete the reps one way, then reverse the circle.
safetyNotes: >-
  Keep the orbit tight to the head — wide, fast circles torque the shoulders and can clip the skull. Skip it if your
  shoulders lack comfortable range behind the head.
