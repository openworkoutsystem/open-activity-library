modality: resistance
metValue: 4.5
instructions:
  - title: Start in pike
    detail: Set hands and feet wide of a normal push-up with hips pushed high toward the ceiling.
  - title: Dive forward
    detail: Bend the elbows and sweep your chest forward, skimming just above the floor.
  - title: Rise to up-dog
    detail: Press your chest up and forward until your arms are straight and hips are low.
  - title: Reverse the arc
    detail: Push back through the same low path to return to the high pike.
safetyNotes: >-
  The up-dog finish extends the low back under load — keep the glutes engaged and shorten the arc if your lumbar spine
  pinches. Shoulders should stay away from the ears through the dive.
