id: lib-1788131480690-0niuda
name: Dive Bomber Push-Up
description: >-
  Swoop from a pike position down through a low push-up and up into an upward-dog line, then reverse the path. It works
  the chest, shoulders, and triceps through constantly changing angles while mobilizing the spine, hips, and hamstrings.
  Imagine sliding your chest under a low fence and back again — the bar stays low the whole way.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Chest
  - Shoulders
  - Triceps
secondaryMuscles:
  - Abs
  - Lower Back
  - Hamstrings
equipment: []
tags:
