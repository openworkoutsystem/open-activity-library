id: lib-1788127175187-f1dw4q
name: Diaphragmatic Breathing
description: >-
  Slow breathing directed into the belly while the chest stays quiet — the base skill every other breath practice builds
  on. It retrains the diaphragm to do the work that stressed, desk-bound breathing outsources to the neck and chest. One
  hand on the chest and one on the belly tells you instantly whether it's working.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles: []
secondaryMuscles: []
equipment: []
tags:
  - Breathwork Exercises
  - Mind-Body
  - Recovery
metValue: 1
instructions:
  - title: Position the hands
    detail: Lie down or sit tall with one hand on the chest and one on the belly.
  - title: Inhale low
    detail: Breathe in through the nose so the belly hand rises while the chest hand stays still.
  - title: Exhale slowly
    detail: Let the belly fall on a long, unforced exhale through the nose or pursed lips.
  - title: Keep the rhythm
    detail: Continue for five minutes, keeping the chest hand quiet throughout.
safetyNotes: >-
  No meaningful physical risk — the only failure mode is effort, forcing big breaths instead of letting them sink low.
  If lying flat is uncomfortable, bend the knees or practice seated.
