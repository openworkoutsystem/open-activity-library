id: lib-1788127175715-0oa7sh
name: Legs Up the Wall
description: >-
  Lie on your back with the legs resting vertically up a wall — the do-nothing recovery pose. It drains the day out of
  the legs, settles the nervous system, and asks for exactly zero effort or skill. Scoot the hips close to the wall and
  let the wall hold everything.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles: []
secondaryMuscles: []
equipment: []
tags:
  - Recovery
  - Cool-Down
  - Mind-Body
  - Yoga
metValue: 1
instructions:
  - title: Set up close
    detail: Sit sideways against the wall, then swing the legs up as you lie back.
  - title: Adjust the hips
    detail: Scoot until the hips are near the wall and the legs rest comfortably vertical.
  - title: Settle and breathe
    detail: Rest the arms at the sides and breathe slowly for five to ten minutes.
  - title: Exit gently
    detail: Bend the knees, roll to one side, and pause before sitting up.
safetyNotes: >-
  It is a mild inversion — anyone with uncontrolled high blood pressure or glaucoma should check with a doctor first.
  Tingling feet just means bend the knees or come down, and if tight hamstrings pull the hips off the floor, move them
  back from the wall instead of fighting it.
