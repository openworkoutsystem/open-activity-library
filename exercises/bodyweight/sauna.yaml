id: lib-1788215818951-492cjd
name: Sauna
description: >-
  Sit in a heated room - a traditional dry sauna around 170 to 195 degrees Fahrenheit, or an infrared cabin at a lower
  temperature - for a timed block. Heat exposure lifts heart rate and drives a heavy sweat with no mechanical load on
  the joints, which makes it a clean add-on after training or on a rest day. Hydrate before you go in and let the clock,
  not stubbornness, decide when you come out.
