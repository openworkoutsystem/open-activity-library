instructions:
  - title: Hydrate first
    detail: >-
      Drink 8 to 16 ounces of water before entering and bring a bottle with you, because a 15 minute session costs you
      real fluid.
  - title: Pick your bench
    detail: >-
      Sit on a towel and start on a lower bench where the air is cooler, moving higher only once you know how you handle
      the heat.
  - title: Time the session
    detail: Cap early sessions at 10 to 15 minutes, then step out and cool down, repeating only if you still feel steady.
  - title: Cool down properly
    detail: >-
      Cool off in fresh air or a lukewarm shower and replace fluids with water and a little sodium before you drive or
      lift.
safetyNotes: >-
  Heat stress drops blood pressure, so stand up slowly and leave immediately for dizziness, nausea, or a headache. Skip
  the sauna entirely if you are pregnant, drinking, already dehydrated, or managing an uncontrolled heart or
  blood-pressure condition.
