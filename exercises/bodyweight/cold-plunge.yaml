id: lib-1788215818784-jwxq7r
name: Cold Plunge
description: >-
  Submerge to the shoulders in cold water, roughly 50 to 59 degrees Fahrenheit, and stay in for a few controlled
  minutes. It is a recovery and stress-tolerance tool that dulls perceived soreness and trains you to stay calm while
  your breathing wants to run away. Keep it away from the hours right after lifting, since cold immersion can blunt the
  muscle-building response to that session.
