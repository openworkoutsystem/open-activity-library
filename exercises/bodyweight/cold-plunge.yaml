instructions:
  - title: Check the water
    detail: >-
      Aim for 50 to 59 degrees Fahrenheit on early plunges; colder is not better and only shortens the time you can stay
      calm in it.
  - title: Enter deliberately
    detail: >-
      Step in and lower to the shoulders in one committed motion rather than easing down inch by inch, and keep the
      hands under the water.
  - title: Own the first breath
    detail: >-
      Expect a hard gasp reflex for the first 20 to 30 seconds, and slow your exhale until the breathing is quiet before
      you judge the temperature.
  - title: Exit and rewarm
    detail: >-
      Get out at your planned time, towel off, and rewarm by walking or moving rather than jumping straight into a hot
      shower.
safetyNotes: >-
  Cold water triggers a gasp reflex and blood-pressure spike that can be dangerous with heart conditions, uncontrolled
  hypertension, or pregnancy - clear it with a doctor first and never plunge alone or after drinking. Get out
  immediately for spreading numbness, dizziness, or shivering you cannot control.
