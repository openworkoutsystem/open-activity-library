id: lib-1788127174808-3sz6cx
name: Box Breathing
description: >-
  Inhale, hold, exhale, hold — four equal counts, around and around the box. It downshifts the nervous system on demand,
  which is why it shows up before sleep, between hard sets, and in professions built on staying calm under pressure.
  Breathe through the nose, keep the counts unhurried, and let the shoulders stay down.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles: []
secondaryMuscles: []
equipment: []
tags:
  - Breathwork Exercises
  - Mind-Body
  - Recovery
metValue: 1
instructions:
  - title: Sit comfortably
    detail: Sit tall with the shoulders relaxed and exhale fully to begin.
  - title: Inhale four
    detail: Breathe in through the nose for a slow count of four.
  - title: Hold four
    detail: Hold the breath gently for four counts without clamping down.
  - title: Exhale four
    detail: Release the breath through the nose for four counts.
  - title: Hold and repeat
    detail: Hold empty for four counts, then continue the cycle for the full session.
safetyNotes: >-
  Breath holds can cause lightheadedness early on — practice seated and shorten the counts to three rather than
  straining. Skip the holds if pregnant or if they trigger anxiety instead of calm.
