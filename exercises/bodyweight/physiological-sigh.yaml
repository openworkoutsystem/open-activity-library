metValue: 1
instructions:
  - title: Inhale fully
    detail: Breathe in through the nose until the lungs feel comfortably full.
  - title: Top it off
    detail: Take a second short sniff of air on top of the first inhale.
  - title: Exhale long
    detail: Let the breath out slowly through the mouth until the lungs are empty.
  - title: Repeat as needed
    detail: Use one to three sighs in the moment, or keep cycling for up to five minutes.
safetyNotes: >-
  About as low-risk as breathwork gets — the only note is to keep the exhale relaxed rather than forced. If several
  minutes of cycling brings on lightheadedness, pause and breathe normally.
