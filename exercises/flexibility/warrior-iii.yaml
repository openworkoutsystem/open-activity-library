id: lib-1788131477144-1akope
name: Warrior III
description: >-
  A single-leg balance with the torso, arms, and lifted leg forming one horizontal line. It trains the standing leg's
  glutes and hamstrings, the deep core, and the balance system all at once. Keep the lifted-leg hip pointing down —
  letting it splay open is the common leak.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Glutes
  - Hamstrings
secondaryMuscles:
  - Abs
  - Lower Back
  - Calves
equipment: []
tags:
  - Yoga
  - Balance
  - Lower Body
  - Isometric
modality: flexibility
metValue: 2.8
unilateral: always
instructions:
  - title: Shift the weight
    detail: Stand tall and shift all your weight into one leg with a soft knee.
  - title: Hinge forward
    detail: Tip the torso forward as the back leg lifts behind you.
  - title: Find the line
    detail: Level the hips and extend the arms until head, torso, and lifted leg form one line.
  - title: Flex the foot
    detail: Point the lifted-leg toes at the floor to keep the hip square.
  - title: Hold and switch
    detail: Fix the gaze on one spot for the hold, then change legs.
safetyNotes: >-
  Practice near a wall or with fingertips on a chair until the balance is steady, and keep a microbend in the standing
  knee.
