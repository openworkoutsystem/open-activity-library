modality: flexibility
metValue: 1
instructions:
  - title: Lie flat
    detail: Rest on the back with legs extended and arms a comfortable distance from the body.
  - title: Release everything
    detail: Let the feet fall open, turn the palms up, and unclench the jaw.
  - title: Scan the body
    detail: Move attention slowly from feet to head, softening each area you pass.
  - title: Stay put
    detail: Remain still and breathe naturally until the timer ends, then roll to one side to rise.
safetyNotes: >-
  Place a bolster under the knees if the lower back complains when flat, and cover up — the body cools quickly in
  stillness.
