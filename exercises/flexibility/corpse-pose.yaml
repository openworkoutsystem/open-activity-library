id: lib-1788131478994-kq76mz
name: Corpse Pose
description: >-
  Deliberate stillness lying flat at the end of practice — the hardest pose to take seriously and the easiest to skip.
  It trains the nervous system to actually down-shift, letting the body absorb whatever the practice just built. Let the
  feet fall open, turn the palms up, and resist the urge to fidget.
experienceLevelRecommended: beginner
schemaVersion: 1
