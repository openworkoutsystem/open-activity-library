id: lib-1788131478249-s9fnhi
name: Happy Baby
description: >-
  Lying on the back with the knees drawn wide toward the armpits and the hands gripping the feet. It opens the inner
  thighs, hips, and lower back with almost no effort required to hold it. Keep the tailbone heavy on the mat — pulling
  it off the floor cancels the hip stretch.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Adductors
  - Glutes
secondaryMuscles:
  - Hamstrings
  - Lower Back
equipment:
  - yoga_mat
tags:
  - Yoga
  - Restorative Yoga
  - Flexibility
  - Cool-Down
modality: flexibility
metValue: 2
instructions:
  - title: Lie on your back
    detail: Draw both knees toward the chest.
  - title: Grab the feet
    detail: Hold the outer edges of the feet with the soles facing the ceiling.
  - title: Open the knees
    detail: Pull the knees wide toward the armpits with the shins vertical.
  - title: Anchor and rock
    detail: Keep the tailbone heavy on the mat and rock gently side to side if it feels good.
safetyNotes: >-
  Hold the shins or thighs instead of the feet if the grip forces the tailbone off the floor; avoid deep hip flexion in
  late pregnancy or after recent hip surgery.
