id: lib-1788215819211-6aywbf
name: Squat to Stand
description: >-
  Hook your fingers under your toes, sink into a deep squat with the chest tall, then straighten the legs back into a
  folded stretch while keeping hold of the feet. The bottom half opens the adductors and hips, the top half loads the
  hamstrings, which makes it a strong two-for-one before squatting or deadlifting. Keep the grip on your toes the whole
  rep so the chest stays up instead of collapsing forward.
experienceLevelRecommended: beginner
schemaVersion: 1
