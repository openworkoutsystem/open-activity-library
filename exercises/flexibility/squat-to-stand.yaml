instructions:
  - title: Grab your toes
    detail: >-
      Stand with your feet slightly wider than your hips, hinge forward with soft knees, and hook the fingers of each
      hand under the toes of that foot.
  - title: Drop into the squat
    detail: >-
      Pull lightly on your toes as you sink the hips straight down into a deep squat, driving the knees out against your
      arms.
  - title: Lift the chest
    detail: >-
      Keep hold of the toes and use your elbows against the inside of your knees to press the chest tall and the spine
      long, then hold for a beat.
  - title: Straighten to stretch
    detail: >-
      Push the hips up toward the ceiling with the hands still on your toes until the hamstrings pull, then re-squat for
      the next rep.
safetyNotes: >-
  If tight hamstrings pull your low back into a hard round on the way up, bend the knees more instead of forcing the
  legs straight. Skip the deep bottom position if you have hip impingement or a knee that pinches at full flexion.
