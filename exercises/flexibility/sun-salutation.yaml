id: lib-1788131479157-vmry59
name: Sun Salutation
description: >-
  The flowing warm-up sequence linking fold, plank, low push-up, upward dog, and downward dog into one breath-paced
  circuit. It warms every major joint, wakes the posterior chain, and sets the breathing rhythm for the rest of the
  practice. Move one breath per movement — the pace is the point.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Full Body
secondaryMuscles: []
equipment:
  - yoga_mat
tags:
  - Yoga
  - Warm-Up
  - Mobility
  - Compound
  - Flexibility
modality: flexibility
metValue: 4
instructions:
  - title: Start in mountain
    detail: Stand tall at the top of the mat and inhale the arms overhead.
  - title: Fold forward
    detail: Exhale and hinge into a standing forward fold.
  - title: Step to plank
    detail: Plant the hands, step or hop back, and hold a strong plank.
  - title: Lower with control
    detail: Bend the elbows along the ribs into a low push-up.
  - title: Roll to upward dog
    detail: Inhale over the toes, straighten the arms, and open the chest.
  - title: Press to down dog
    detail: Exhale the hips up and back, hold for a few breaths, then step forward to stand.
safetyNotes: >-
  Drop the knees during the low push-up whenever form degrades — the sequence repeats too often to let sloppy lowering
  accumulate on the shoulders and lower back.
