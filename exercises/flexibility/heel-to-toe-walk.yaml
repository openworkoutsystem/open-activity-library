id: lib-1788127166970-bgo1ls
name: Heel-to-Toe Walk
description: >-
  Walk a straight line placing each heel directly against the toes of the other foot — balance in motion. The narrow,
  moving base is harder than any static stance. Eyes ahead, not down; the floor is not going anywhere.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Calves
  - Abductors
secondaryMuscles:
  - Tibialis Anterior
  - Abs
equipment: []
tags:
  - Balance
  - Stability
  - No Equipment
  - Low-Impact
modality: flexibility
metValue: 2.5
instructions:
  - title: Find a line
    detail: Pick a straight seam or line on the floor.
  - title: Step heel to toe
    detail: Place each heel directly against the toes of the back foot.
  - title: Eyes ahead
    detail: Keep your gaze on a point ahead, not the floor.
  - title: Walk the length
    detail: Continue slow, deliberate steps for the full time.
safetyNotes: >-
  Walk alongside a wall or counter, not in open space — sideways stumbles happen quickly. Keep the steps slow and
  deliberate; speed hides exactly the wobble this drill is meant to expose.
