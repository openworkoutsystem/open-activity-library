id: lib-1788131477766-o5lpj8
name: Mountain Pose
description: >-
  Standing tall on purpose: feet grounded, legs active, crown reaching up — the reset every flow returns to. It trains
  postural alignment and body awareness rather than any single muscle. Stack ears over shoulders over hips over ankles
  and let the breath settle.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Full Body
secondaryMuscles: []
equipment: []
tags:
  - Yoga
  - Posture
  - Mind-Body
  - No Equipment
modality: flexibility
metValue: 2
instructions:
  - title: Ground the feet
    detail: Stand with feet together or hip-width apart and spread the toes into the floor.
  - title: Activate the legs
    detail: Lift the kneecaps gently and engage the thighs without locking the knees.
  - title: Stack the spine
    detail: Align ears over shoulders over hips over ankles.
  - title: Reach and breathe
    detail: Let the arms hang active at the sides and breathe slowly through the nose.
safetyNotes: Soften the knees rather than locking them out; this pose is otherwise safe for nearly everyone.
