id: lib-1788131476792-pqof89
name: Warrior I
description: >-
  A lunge-stance standing pose with the back heel grounded, hips squared forward, and arms reaching tall. It strengthens
  the front leg's quadriceps and glutes while opening the back leg's hip flexor and calf. Most of the pose lives in
  squaring the hips toward the front of the mat.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
secondaryMuscles:
  - Hip Flexors
  - Calves
  - Shoulders
equipment: []
tags:
  - Yoga
  - Lower Body
  - Flexibility
  - No Equipment
modality: flexibility
metValue: 2.5
unilateral: always
instructions:
  - title: Take the stance
    detail: Step one foot back about a leg's length and angle the back foot slightly out.
  - title: Ground the heel
    detail: Press the entire back foot into the floor, heel included.
  - title: Square the hips
    detail: Draw both hip points to face the front of the mat.
  - title: Bend and reach
    detail: Bend the front knee over the ankle and sweep the arms overhead.
  - title: Hold and switch
    detail: Breathe through the hold, then repeat on the other side.
safetyNotes: >-
  Keep the front knee tracking over the ankle, not past the toes, and shorten the stance if the back hip will not square
  forward.
