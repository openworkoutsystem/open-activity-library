id: lib-1788127172904-sdnnu2
name: Foam Roll Glutes
description: >-
  Sit on the roller, cross an ankle over the opposite knee, and lean into the hip you're working — that figure-four tilt
  finds the deep spots the flat position misses. Small slow movements beat long passes here. One side at a time, and the
  tight side usually announces itself.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Glutes
secondaryMuscles:
  - Abductors
equipment:
  - foam_roller
tags:
  - Foam Rolling
  - Recovery
  - Mobility
  - Cool-Down
modality: flexibility
metValue: 2.5
unilateral: always
instructions:
  - title: Sit on roller
    detail: Sit with the roller under one glute and hands behind you for support.
  - title: Cross the ankle
    detail: Place that side's ankle over the opposite knee.
  - title: Lean and search
    detail: Tilt toward the working hip and make small slow rolls.
  - title: Pause and breathe
    detail: Hold on tender points until they ease, then switch sides.
safetyNotes: >-
  Numbness or tingling running down the leg means you're pressing on the sciatic nerve — shift position off it
  immediately. Deep glute spots are tender by nature; lean off slightly rather than gritting through sharp pain.
