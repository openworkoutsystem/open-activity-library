instructions:
  - title: Starting Position
    detail: Sit or stand tall with your shoulders relaxed and spine neutral. Look straight ahead.
  - title: Perform the Tuck
    detail: >-
      Gently draw your chin straight back toward the back of your neck (like making a double chin). Keep your head level
      — do not tilt your head down or up.
  - title: Hold
    detail: Hold the tucked position for 3-5 seconds while maintaining normal breathing.
  - title: Release
    detail: Slowly return to the starting position. Avoid pushing your head forward.
  - title: Repetitions
    detail: Repeat for the desired number of reps or holds.
safetyNotes: >-
  Stop immediately if you feel sharp pain. Move slowly and gently. This exercise is generally safe for most people with
  tech neck but consult a doctor or physical therapist if you have diagnosed neck issues, recent injury, or severe pain.
  Do not force the movement. This is a bodyweight exercise - no weight load applies.
