id: lib-1773074704963-vgf7vi
name: Chin Tuck
description: >-
  A simple neck exercise that strengthens the deep neck flexors and helps correct forward head posture (tech neck). It
  involves gently tucking your chin toward your neck while keeping your head level. Excellent for people with desk jobs
  or neck pain.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Neck
