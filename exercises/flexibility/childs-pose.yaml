instructions:
  - title: Starting Position
    detail: >-
      Begin on your hands and knees on a yoga mat, with your wrists directly under your shoulders and your knees
      directly under your hips. Spread your knees wide apart while keeping your big toes touching.
  - title: Lower Into the Pose
    detail: >-
      Exhale and slowly sit your hips back toward your heels. Extend your arms forward on the mat, palms facing down,
      and allow your forehead to rest gently on the floor.
  - title: Adjust for Comfort
    detail: >-
      If your forehead does not reach the floor, place a yoga blanket or bolster underneath it. You can also place a
      bolster between your thighs and torso for extra support.
  - title: Hold and Breathe
    detail: >-
      Relax your shoulders, neck, and back. Breathe deeply and hold the pose for the desired duration, typically 30-60
      seconds or longer for restorative practice.
  - title: Exit the Pose
    detail: >-
      To come out, inhale and gently walk your hands back toward your body, lifting your torso and returning to a seated
      or hands-and-knees position.
safetyNotes: >-
  Use a blanket or bolster for support if knees or hips are tight; breathe deeply and avoid forcing the stretch. Common
  mistakes include not relaxing the shoulders or placing too much pressure on the neck.
