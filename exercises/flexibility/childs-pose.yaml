name: Child's Pose
description: >-
  Child's Pose is a restorative yoga posture where you kneel on the floor, sit back on your heels, and fold forward with
  arms extended, resting your forehead on the mat. It gently stretches the back, hips, thighs, and ankles while
  promoting relaxation and stress relief. Often used in yoga for recovery, it targets the latissimus dorsi, glutes, and
  erector spinae.
