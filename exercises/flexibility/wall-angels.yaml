instructions:
  - title: Setup
    detail: >-
      Stand with your back against a flat wall, feet about 6-12 inches away from the wall. Press your lower back, upper
      back, and head gently against the wall. Bend your elbows to 90 degrees and raise your arms so that your upper arms
      are parallel to the floor and your forearms point upward, pressing the backs of your hands and forearms against
      the wall in a 'W' or goal-post position.
  - title: Movement
    detail: >-
      Slowly slide your arms upward along the wall, straightening your elbows as you go, until your arms are extended
      overhead in a 'Y' position while keeping as much contact as possible with the wall. Keep your core engaged and
      avoid arching your lower back.
  - title: Return
    detail: >-
      Slowly lower your arms back down to the starting 'W' position, maintaining wall contact throughout the movement.
      Focus on controlled motion and proper scapular movement.
  - title: Repetition
    detail: >-
      Repeat for the desired number of reps, breathing steadily and stopping if you feel any pinching or sharp pain in
      the shoulders.
safetyNotes: >-
  Keep your lower back and head against the wall throughout; avoid arching your back or forcing the arms if range is
  limited. Common mistakes include shrugging shoulders or compensating with excessive lumbar extension.
