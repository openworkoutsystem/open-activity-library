id: lib-1773092798356-usl9fu
name: Wall Angels
description: >-
  Wall Angels are performed by standing against a wall with your back, head, and arms in contact, then sliding your arms
  up and down like making snow angels. This bodyweight mobility exercise improves shoulder range of motion, thoracic
  extension, and scapular control while correcting poor posture. It prepares the upper body for pressing or pulling
  movements and targets the shoulders and upper back.
