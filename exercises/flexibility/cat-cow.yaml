id: lib-1773327889902-bf9jhl
name: Cat-Cow
description: >-
  Cat-Cow Stretch is a gentle yoga flow that improves spinal mobility by alternating between arching the back (Cow pose)
  and rounding it (Cat pose), making it ideal for warm-ups and beginners.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Lower Back
  - Transverse Abdominis
secondaryMuscles:
  - Abs
  - Serratus Anterior
equipment: []
tags:
  - Yoga
  - Stretch
