modality: flexibility
metValue: 2.5
instructions:
  - title: Setup
    detail: >-
      Position yourself on all fours in a tabletop stance, with your hands directly under your shoulders and knees under
      your hips. Maintain a neutral spine.
  - title: Cow Pose
    detail: >-
      Inhale deeply, letting your belly drop toward the floor while lifting your chest, chin, and tailbone upward.
      Gently arch your back.
  - title: Cat Pose
    detail: >-
      Exhale fully, drawing your belly toward your spine, rounding your back toward the ceiling, and tucking your chin
      to your chest.
  - title: Flow
    detail: >-
      Continue flowing smoothly between Cow and Cat poses, syncing movement with your breath, for the recommended number
      of reps per set.
safetyNotes: >-
  Perform the movement slowly and with full control to prevent strain. Avoid if you have acute back, neck, or wrist
  pain; consult a healthcare professional if unsure. Breathe continuously and do not force the arch or round.
