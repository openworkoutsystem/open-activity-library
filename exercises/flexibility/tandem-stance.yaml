id: lib-1788127166329-bd2myb
name: Tandem Stance
description: >-
  Stand heel-to-toe as if on a tightrope and hold. The narrow base removes the side-to-side stability you normally take
  for granted, forcing the ankles and hips to work. Swap which foot leads — most people have a clearly harder side.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Calves
  - Abductors
secondaryMuscles:
  - Tibialis Anterior
  - Abs
equipment: []
tags:
  - Balance
  - Stability
  - No Equipment
  - Low-Impact
modality: flexibility
metValue: 2.5
unilateral: optional
instructions:
  - title: Line up the feet
    detail: Place one heel directly against the opposite toes.
  - title: Stand tall
    detail: Stack the hips and shoulders over the narrow base.
  - title: Hold quietly
    detail: Breathe normally and hold with minimal sway.
  - title: Swap the lead
    detail: Repeat with the other foot in front.
safetyNotes: >-
  Stand beside a wall — the narrow base fails sideways fast. This is a common fall-risk screen for a reason; older or
  post-injury users should keep support within reach.
