id: lib-1788127169397-n463yj
name: Standing Quad Stretch
description: >-
  Pull the heel to the glute with the knees together — a direct stretch for the front of the thigh. It is the standard
  finisher after running, cycling, or leg day. Squeezing the glute on the standing-still side keeps the stretch in the
  quad instead of the low back.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
secondaryMuscles:
  - Hip Flexors
equipment: []
tags:
  - Static Stretching
  - Flexibility
  - Cool-Down
  - Lower Body
  - No Equipment
modality: flexibility
metValue: 2.3
unilateral: always
instructions:
  - title: Stand tall
    detail: Stand on one leg, holding a wall or chair if you need balance.
  - title: Pull heel back
    detail: Grab the ankle of the free leg and draw the heel toward the glute.
  - title: Keep knees together
    detail: Point the bent knee straight down so it stays beside the standing knee.
  - title: Tuck and hold
    detail: Tuck the pelvis slightly, squeeze the glute, and hold while breathing.
safetyNotes: >-
  Letting the knee drift forward or the back arch shifts the stretch out of the quad and into the lumbar spine — keep
  the pelvis tucked. Skip the deep pull if the knee itself complains.
