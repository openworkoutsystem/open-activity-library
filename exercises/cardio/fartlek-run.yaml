metValue: 9
instructions:
  - title: Warm up easy
    detail: Run five to ten minutes at a conversational pace until the breathing settles and the legs feel loose.
  - title: Pick a target
    detail: Choose a landmark ahead - a lamppost, a tree, the crest of a hill - and commit to it as your next surge.
  - title: Surge to it
    detail: >-
      Lift to a strong controlled pace all the way to that landmark, staying tall with quick turnover instead of
      overstriding.
  - title: Float, do not stop
    detail: Drop back to an easy running pace until the breathing recovers, then choose the next target and go again.
  - title: Cool it down
    detail: Finish with five minutes of easy running so the session ends well below your surge effort.
safetyNotes: >-
  Unstructured surges tempt you into sprinting on cold legs, so keep the first two efforts moderate. Watch footing on
  curbs and trails once the pace picks up, and end the surges early if a calf or achilles starts complaining.
