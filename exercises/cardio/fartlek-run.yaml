id: lib-1788215817966-40bdik
name: Fartlek Run
description: >-
  Run continuously while varying the pace by feel, surging to a landmark then easing back to a conversational effort and
  repeating for the whole session. Swedish for 'speed play', it delivers interval-style stress without a track, a
  stopwatch, or fixed rest, which makes it the most flexible way to add intensity to an easy run. Choose the next surge
  target before you start pushing and hold pace until you reach it, not until you feel tired.
