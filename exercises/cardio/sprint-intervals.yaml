id: lib-1788127167635-nrfkcj
name: Sprint Intervals
description: >-
  Short all-out efforts of 10 to 30 seconds separated by full, walking recoveries — top-end speed and power that steady
  running never touches. The recovery is the point: start each rep fresh or it stops being a sprint. Quality over
  quantity, always.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Legs
secondaryMuscles:
  - Glutes
  - Hamstrings
  - Calves
