modality: cardio
metValue: 12.3
instructions:
  - title: Warm up progressively
    detail: Jog, drill, and run several strides building toward full speed.
  - title: Sprint hard
    detail: Run 10 to 30 seconds at near-maximal effort.
  - title: Recover fully
    detail: Walk for two to four minutes until you feel fresh.
  - title: Repeat with quality
    detail: Run six to ten reps and stop when speed drops off.
safetyNotes: >-
  Sprinting carries the highest hamstring-strain risk of anything in this library — warm up thoroughly and build to full
  speed across the first few reps, especially if you haven't sprinted in months.
