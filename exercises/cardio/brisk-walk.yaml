instructions:
  - title: Warmup stride
    detail: Start with 2min easy walk to loosen legs.
  - title: Brisk pace
    detail: Increase to 3-4mph comfortable pace where you can talk but not sing. Swing arms naturally.
  - title: Posture check
    detail: Keep shoulders relaxed, gaze forward, engage core. Avoid tech-neck by looking 20ft ahead.
  - title: Cool down
    detail: Last 2min ease back to slow walk.
  - title: Track distance
    detail: Aim ~0.75-1mi total.
safetyNotes: Shoulder-safe. Stop if sharp pain. Good for tech-neck posture practice.
