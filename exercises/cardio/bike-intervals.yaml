id: lib-1788127168381-lmjzi9
name: Bike Intervals
description: >-
  Alternating hard and easy blocks on the bike — repeatable high intensity with no impact cost. The bike lets you hit
  precise effort targets and recover exactly, rep after rep. Classic formats: 30 seconds on, 30 off, or 4 minutes hard,
  3 easy.
experienceLevelRecommended: intermediate
schemaVersion: 1
