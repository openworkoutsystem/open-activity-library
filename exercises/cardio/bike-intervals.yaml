metValue: 8.8
instructions:
  - title: Warm up spinning
    detail: Ride easy for five minutes, adding two or three short surges.
  - title: Go hard
    detail: Push the work interval at an effort you can just repeat.
  - title: Spin easy
    detail: Drop resistance and pedal lightly through the recovery block.
  - title: Repeat and cool down
    detail: Complete all rounds, then spin easy for five minutes.
safetyNotes: >-
  Zero impact doesn't mean zero cost — hard bike intervals stack fatigue quickly. Check saddle height before pushing big
  resistance, and end the session when power falls off rather than grinding a dead cadence.
