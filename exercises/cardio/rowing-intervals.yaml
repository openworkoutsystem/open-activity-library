modality: cardio
metValue: 8.5
instructions:
  - title: Warm up rowing
    detail: Row easy for five minutes with a few ten-stroke builds.
  - title: Pick a target split
    detail: Choose a pace you believe you can hold for every rep.
  - title: Row the piece
    detail: Hold the split with a legs-back-arms sequence on every stroke.
  - title: Paddle to recover
    detail: Row very light between pieces, then repeat.
safetyNotes: >-
  Technique decays fast at high stroke rates — if the lower back starts rounding under fatigue, end the piece. The
  sequence stays legs-back-arms even at sprint pace.
