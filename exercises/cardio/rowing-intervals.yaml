id: lib-1788127168504-xe75qv
name: Rowing Intervals
description: >-
  Timed hard pieces on the erg — 500-meter repeats, minute-on minute-off — the honest conditioning test. The monitor
  reports your split every stroke, so pacing discipline is the actual skill being trained. Start conservative; the erg
  punishes fliers.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
  - Legs
  - Back
secondaryMuscles:
  - Biceps
  - Glutes
