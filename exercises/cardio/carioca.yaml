id: lib-1788215818132-vo5n2c
name: Carioca
description: >-
  Travel sideways while the trailing leg crosses alternately in front of and behind the lead leg, letting the hips
  rotate with every cross. It is the standard field-sport warm-up drill for opening hip rotation and teaching the feet
  to keep up with a turning torso. Stay on the balls of your feet and let the hips do the turning while the shoulders
  stay roughly square.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
