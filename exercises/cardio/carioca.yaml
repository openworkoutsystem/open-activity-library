modality: cardio
metValue: 6.5
instructions:
  - title: Stand sideways
    detail: >-
      Face perpendicular to your direction of travel with the feet hip width apart, knees soft, and the arms out for
      balance.
  - title: Cross in front
    detail: Step the trailing leg across the front of the lead leg and let the hip rotate open as that foot lands.
  - title: Cross behind
    detail: Move the lead foot out to the side, then step the trailing leg behind it, rotating the hip the other way.
  - title: Build the rhythm
    detail: >-
      Speed the alternating front-and-behind pattern up over ten to twenty yards, staying light on the balls of the
      feet.
  - title: Switch directions
    detail: Come back the other way so the opposite hip leads, and repeat for two to four passes.
safetyNotes: >-
  The crossing step is a natural ankle-roll position, so start slow on flat even ground and add speed only once the
  pattern is smooth. Keep carioca early in the warm-up while you are fresh, because tired legs are where the feet
  tangle.
