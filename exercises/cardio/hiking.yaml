instructions:
  - title: Preparation
    detail: >-
      Choose a trail with moderate elevation. Wear supportive shoes and weather-appropriate clothing. Start with a 5-min
      easy walk to warm up.
  - title: Walking Phase
    detail: Maintain brisk pace (3-4 mph). Swing arms naturally. Keep posture upright, engage core.
  - title: Elevation Handling
    detail: On inclines, shorten stride, lean forward slightly from ankles. On declines, control speed to protect knees.
  - title: Pacing and Breathing
    detail: >-
      Breathe deeply and rhythmically. Aim for conversational pace (can talk but not sing). Use heart rate monitor if
      available (60-80% max HR).
  - title: Cool Down
    detail: Finish with 5-min easy flat walk. Stretch calves, hamstrings, and quads.
safetyNotes: >-
  Start with easy trails. Use proper footwear. Stay hydrated and check weather. Stop if you experience knee, ankle, hip
  or lower back pain (especially important at current bodyweight). Use trekking poles for stability if needed. Avoid
  steep descents if you have knee issues.
