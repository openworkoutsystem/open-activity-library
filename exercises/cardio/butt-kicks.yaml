modality: cardio
metValue: 7.5
instructions:
  - title: Jog in place
    detail: Start an easy jog with a tall chest.
  - title: Flick the heels
    detail: Snap each heel up toward the glute with the knee pointing at the floor.
  - title: Stay light
    detail: Keep contacts quick and quiet on the midfoot.
  - title: Build speed
    detail: Increase the turnover as the hamstrings warm up.
safetyNotes: >-
  Keep the contacts light and build speed gradually — this drill loads the calves and Achilles quickly, so ease into it
  if they're cranky. The heel flick should be relaxed, not a forced kick.
