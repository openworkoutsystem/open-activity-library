id: lib-1788127172406-gam0lw
name: Butt Kicks
description: >-
  Jog in place flicking the heels to the glutes — hamstring turnover prep before any running. The knees stay pointing
  down while the heels cycle fast and light, priming the exact motion the hamstrings perform at speed. Pairs naturally
  with high knees in a pre-run sequence.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Hamstrings
secondaryMuscles:
  - Calves
  - Quadriceps
  - Hip Flexors
equipment: []
tags:
