id: lib-1788127168254-8qspnb
name: Stationary Bike
description: >-
  Steady riding indoors — the most controllable zone work there is, with zero impact. Resistance and cadence set the
  effort exactly, which makes it ideal for recovery spins, zone 2 blocks, or bad-weather volume. Aim for a cadence
  around 80 to 95 rpm.
experienceLevelRecommended: beginner
