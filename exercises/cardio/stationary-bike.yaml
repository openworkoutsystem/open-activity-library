metValue: 7
instructions:
  - title: Set saddle height
    detail: Adjust the seat so your knee keeps a slight bend at the bottom of the stroke.
  - title: Spin up easy
    detail: Pedal lightly for a few minutes to warm up.
  - title: Dial in effort
    detail: Set resistance so breathing is deep but conversation stays possible.
  - title: Hold the cadence
    detail: Keep 80 to 95 rpm for the full duration.
safetyNotes: >-
  Set the saddle so the knee keeps a slight bend at the bottom of the stroke — a seat that is too low is the usual cause
  of knee pain on the bike.
