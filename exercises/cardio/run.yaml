instructions:
  - >-
    Start with a 5-10 minute dynamic warmup: marching in place, leg swings, arm circles, and high knees to prepare
    muscles and joints.
  - "Maintain good posture: head up, shoulders relaxed, arms at 90 degrees swinging naturally, land midfoot."
  - Breathe rhythmically, such as inhaling for 3 steps and exhaling for 2.
  - Choose appropriate terrain and shoes; start slow if beginner.
  - Cool down with 5 minutes of walking and static stretches for legs and hips.
safetyNotes: >-
  Maintain good posture with a slight forward lean, land mid-foot to avoid excessive impact on joints, and start with a
  proper warm-up; common mistakes include overstriding, poor arm swing, or ignoring pain in knees/hips which could lead
  to injury—gradually increase distance and speed to prevent overuse.
