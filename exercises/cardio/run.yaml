id: lib-1772519902674-jdjkxi
name: Run
description: >-
  Running is a fundamental cardiovascular exercise where you move at a steady jogging or faster running pace over a
  distance, either outdoors on trails/roads or indoors on a treadmill. It enhances aerobic capacity, aids in calorie
  burning and weight management, and builds endurance in the lower body while also boosting mental health through
  endorphin release. Primary target muscles include the quadriceps, hamstrings, glutes, and calves.
