id: lib-1773070891730-j8f90h
name: Run/Walk Intervals
description: >-
  Run/Walk involves alternating between running and walking intervals or maintaining a continuous pace, making it ideal
  for beginners to build cardiovascular fitness and endurance. This exercise enhances heart health, burns calories, and
  improves overall stamina. It primarily targets the quadriceps, hamstrings, calves, and glutes.
experienceLevelRecommended: beginner
schemaVersion: 1
