id: lib-1788215817328-fnad49
name: Lateral Shuffle
description: >-
  Drop into an athletic stance and push off the outside leg to travel sideways, staying low without letting the feet
  click together. It trains the side-to-side movement that running and cycling never touch, waking up the hip abductors
  and adductors that stabilize every change of direction. Keep the hips low and the chest up - popping upright turns it
  into a side skip.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Abductors
  - Glutes
  - Quadriceps
secondaryMuscles:
