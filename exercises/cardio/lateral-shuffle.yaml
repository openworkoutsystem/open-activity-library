modality: cardio
metValue: 7
instructions:
  - title: Take the stance
    detail: >-
      Set the feet slightly wider than your shoulders, bend the knees and hips into a quarter squat, and hold the hands
      up in front of your chest.
  - title: Push, do not step
    detail: >-
      Drive off the trailing foot to move sideways so the lead foot lands first and the trail foot follows, never
      crossing over.
  - title: Stay low
    detail: >-
      Keep the head level and the hips down for the whole distance so your shoulders travel in a flat line instead of
      bobbing.
  - title: Work both ways
    detail: Shuffle five to ten yards in one direction, then return leading with the other foot so both hips get equal work.
safetyNotes: >-
  The trail foot clipping the lead foot is the common trip, so keep a fist of space between them the whole way across.
  On slick floors or worn shoes the plant foot can slide out sideways, so shuffle only on a surface with real grip.
