id: lib-1773266601437-kk52xg
name: Stroller Jog
description: >-
  A cardiovascular exercise that involves pushing a stroller while jogging, providing a full-body workout while allowing
  parents to stay active with their child.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
  - Hamstrings
  - Calves
secondaryMuscles:
  - Abs
  - Shoulders
  - Chest
equipment:
  - Stroller
tags:
  - Cardio
  - Outdoor
  - Parenting
  - Full-Body
  - Aerobic
  - Running
modality: cardio
metValue: 7
instructions:
  - step: 1
    text: Secure your child properly in the stroller with all safety straps fastened
  - step: 2
    text: Choose a smooth, flat or gently sloping route suitable for jogging with a stroller
  - step: 3
    text: Grip the stroller handle firmly with both hands and maintain good posture with a straight back
  - step: 4
    text: Begin with a brisk walk to warm up, then transition into a light jog at a comfortable pace
  - step: 5
    text: Keep your arms relatively straight while pushing the stroller, using your core to maintain stability
  - step: 6
    text: Monitor your child and the path ahead, avoiding sudden turns or uneven terrain
safetyNotes: >-
  Ensure the stroller is designed for jogging (fixed front wheel or swivel lock). Maintain proper posture to avoid back
  strain. Stay hydrated and be aware of traffic and surroundings. Never leave child unattended.
