id: lib-1788215817646-ee2qfp
name: Shadow Boxing
description: >-
  Throw punches at the air from a boxer's stance, moving the feet and rotating the hips through every combination for
  timed rounds. It is the most accessible combat-sport conditioning there is - no bag, no gloves, barely any space - and
  it trains coordination and rotational endurance alongside the heart rate. Punch through the target and snap the hand
  straight back to guard rather than leaving the arm hanging out.
