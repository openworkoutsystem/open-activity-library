instructions:
  - title: Set your stance
    detail: >-
      Stand with the lead foot forward and the feet about shoulder width apart, knees soft, hands up by your cheeks and
      elbows tucked to the ribs.
  - title: Punch from the hips
    detail: >-
      Rotate the hip and pivot the rear foot as each punch extends so the power comes from the ground rather than the
      shoulder alone.
  - title: Recover the hand
    detail: Bring every punch back to your guard along the same line it went out, keeping the other hand up the entire time.
  - title: Move between combos
    detail: Step, pivot, and slip between two- and three-punch combinations so you are never standing flat for long.
  - title: Work in rounds
    detail: Go two to three minutes per round with a minute of easy movement between, building intensity as you warm up.
safetyNotes: >-
  Never snap the elbow into a hard lockout on an unloaded punch - keep a slight bend at full extension or the joint
  absorbs all of the deceleration. Throwing full speed cold is how shoulders get strained, so keep the first round at
  half power.
