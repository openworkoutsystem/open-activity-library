id: lib-1788127175579-cq8e81
name: Mindful Walk
description: >-
  A walk where the walk is the whole task — no podcast, no phone, attention resting on footfalls, breath, and
  surroundings. It doubles as easy aerobic movement and attention practice: recovery for the body and the head at once.
  The pace is whatever lets you keep noticing.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Legs
secondaryMuscles:
  - Calves
equipment: []
tags:
  - Walking
  - Mind-Body
  - Recovery
  - Cardio
  - Outdoor
modality: cardio
metValue: 3
instructions:
  - title: Leave distractions
    detail: Start walking without headphones and put the phone away.
  - title: Find easy pace
    detail: Settle into a pace you could comfortably hold all day.
  - title: Anchor attention
    detail: Rest attention on footfalls, breath, or the sounds around you.
  - title: Return when drifting
    detail: When the mind wanders to the to-do list, bring it back to the walk.
safetyNotes: >-
  Attention turned inward on a road is the one real hazard — keep enough awareness for traffic, cyclists, and curbs, or
  pick a park loop where you can let go fully.
