  - High-Impact
modality: cardio
metValue: 12.3
instructions:
  - title: Jump slightly higher
    detail: Bounce a touch higher than a single under while staying vertical and tight.
  - title: Speed the wrists
    detail: Whip the rope through two full turns per jump using wrists only.
  - title: Keep hands low
    detail: Hold the hands near the hips — rising arms shorten the rope and cause trips.
  - title: Build in singles
    detail: Practice single-single-double patterns before chasing unbroken sets.
safetyNotes: >-
  The rope whip stings and the repeated impact is real — high volume too soon irritates calves and Achilles tendons.
  Practice in short sets while fresh instead of chasing big numbers on a fatigued bounce.
