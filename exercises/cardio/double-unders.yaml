id: lib-1788127173914-uj2guz
name: Double Unders
description: >-
  Two rope passes for every jump — a timing and elasticity skill more than a strength one. The jump gets slightly higher
  and the wrists much faster; big arm circles are the classic fault that kills the rhythm. Once they click, few tools
  deliver more conditioning per minute.
experienceLevelRecommended: advanced
schemaVersion: 1
primaryMuscles:
  - Calves
secondaryMuscles:
  - Forearms
  - Shoulders
  - Quadriceps
equipment:
  - jump_rope
tags:
  - Jumping Rope
  - HIIT
