instructions:
  - title: Check the bike
    detail: Confirm tire pressure, brakes, and saddle height before rolling out.
  - title: Spin, don't grind
    detail: Keep a cadence around 80 to 95 rpm in a comfortable gear.
  - title: Ride predictably
    detail: Hold your line, signal turns, and obey traffic rules.
  - title: Hold steady effort
    detail: Keep breathing conversational for most of the ride.
safetyNotes: >-
  Traffic is the real hazard — wear a helmet, use lights, and ride predictably. Knee pain on the bike is almost always a
  saddle-height problem, so get the fit right before adding volume.
