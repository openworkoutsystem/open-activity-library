id: lib-1788127168127-zn51wk
name: Outdoor Cycling
description: >-
  Riding outside — big low-impact aerobic volume with the scenery included. It builds the quads and the engine while
  sparing the joints entirely, and it's one of the few activities most people can happily do for hours. Effort should
  stay mostly conversational.
