id: lib-1788127167509-lsp0lp
name: Tempo Run
description: >-
  A sustained comfortably-hard pace — roughly what you could race for an hour — that pushes the lactate ceiling up.
  Conversation drops to a few words at a time. Held for 20 to 40 minutes, it is the highest-value single workout in
  distance training.
experienceLevelRecommended: intermediate
schemaVersion: 1
primaryMuscles:
