modality: cardio
metValue: 11
instructions:
  - title: Warm up thoroughly
    detail: Jog easy for ten minutes and add a few pickups.
  - title: Lock in tempo
    detail: Settle at a comfortably-hard pace you could hold for about an hour.
  - title: Check the effort
    detail: Confirm you can still speak a short phrase — if not, back off.
  - title: Cool down
    detail: Jog easy for five to ten minutes after the tempo block.
safetyNotes: >-
  Tempo pace is seductive — going slightly too hard turns it into a race effort you can't recover from this week. If you
  can't speak a short sentence, slow down.
