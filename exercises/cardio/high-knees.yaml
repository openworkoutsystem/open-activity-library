  - Conditioning
  - Agility
  - No Equipment
modality: cardio
metValue: 8
instructions:
  - title: Setup
    detail: Stand tall with feet hip-width apart, knees slightly bent, arms relaxed at your sides, and core engaged.
  - title: Execute
    detail: >-
      Drive your right knee up toward your chest while swinging your left arm forward and right arm back. Quickly
      alternate with the left knee and opposite arm swing. Maintain a fast pace, upright posture, and pump arms
      vigorously to match leg rhythm. Land softly on the balls of your feet.
  - title: Complete
    detail: Continue alternating for the prescribed duration, then rest before the next set.
safetyNotes: >-
  Keep your torso upright and core braced to avoid arching the lower back. Land softly on the balls of your feet to
  minimize joint impact. If you have pre-existing knee, ankle, or back issues, consult a healthcare professional before
  performing.
