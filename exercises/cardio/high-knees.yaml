id: lib-1773327889335-hf4jio
name: High Knees
description: >-
  High knees is a high-intensity cardio exercise performed by running in place with exaggerated knee lifts toward the
  chest. It builds leg strength, improves coordination, agility, and cardiovascular endurance while serving as an
  effective warm-up.
experienceLevelRecommended: beginner
schemaVersion: 1
primaryMuscles:
  - Quadriceps
  - Glutes
  - Calves
  - Hip Flexors
secondaryMuscles:
  - Abs
  - Shoulders
equipment: []
tags:
  - Cardio
