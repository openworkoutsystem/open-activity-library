instructions:
  - title: Stand tall
    detail: Walk with your head up and shoulders relaxed.
  - title: Set an easy pace
    detail: Move at a speed you could hold for hours without strain.
  - title: Swing naturally
    detail: Let your arms swing loosely at your sides.
  - title: Finish the time
    detail: Keep moving continuously for the full duration.
safetyNotes: >-
  Risk here is almost entirely environmental — traffic, curbs, and uneven pavement — so stay aware of your surroundings,
  especially with headphones in.
